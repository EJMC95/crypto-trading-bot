name: Tests

# The fleet had NO automated test suite until 2026-07-18: ~38 in-module
# `--selftest` blocks that nothing ran, so a regression in a *covered* function
# still shipped green. This workflow is that missing regression net.
#
# [2026-08-05 ONE RUNNER — operator-queue CI-quota item, after the 28-Jul
# billing lockout made quota a correctness concern (a lockout kills deploys
# SILENTLY, not just tests).] This was THREE jobs — a lean pytest run, the
# live signer harness, and the coverage-floors run — and the third was a
# strict SUPERSET of the first two: it runs the ENTIRE suite with the PINNED
# signer wheel installed (so the live harness contributes — the (em) floors
# were SET in that configuration) under subprocess-aware coverage. Three
# checkouts + three pip installs + two full suite runs + one subset run
# became one of each: >50% of the workflow's billed minutes, same coverage.
#
# DECLARED LOSS, deliberate: the old lean job also proved the suite passes
# WITHOUT the SDK (the harness self-skip path). That path is still exercised
# by every local run on a machine without the wheel; the import-guard step
# below keeps the opposite rot out (a silent skip in the job that must NOT
# skip). If the self-skip path ever breaks, it breaks loudly on a dev
# machine, not silently in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true  # [28-Jul-2026] a superseded push's run is pure quota burn

jobs:
  suite:
    name: suite + live signer harness + coverage floors (one runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # [2026-08-17 (pi)] FULL HISTORY, so `audit_boot_stagger` can reach a
          # deploy cadence at all. Its preferred source (`gh run list`) needs
          # `actions: read`, which this workflow's GITHUB_TOKEN does not have,
          # so the git commit-time PROXY is the ONLY tier CI can use — and at
          # the default depth of 1 there is no history to read. The audit is in
          # ENFORCED_AUDITS and was therefore structurally unable to fail here:
          # it asserted nothing on every run. Measured before enabling, on the
          # burstiest window this repo has (median gap 2.3 min, min 0.0):
          # nothing fails, because the FAIL condition is contract-based (a
          # burst must outlast the organ's own TTL), not rate-based.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps + the PINNED signer wheel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          # The wheel version comes from requirements.txt — the single source
          # of truth audit_sdk_pin.py enforces — never hardcoded here where it
          # could drift from what the live images actually sign with.
          grep -E '^(lighter-sdk|websockets)' requirements.txt | sed 's/#.*//' | xargs pip install
      - name: The SDK must import — a silent skip is the rot this job exists to prevent
        run: python -c "import lighter, importlib.metadata as m; print('lighter-sdk', m.version('lighter-sdk'))"
      # [2026-07-29 (em)] Finding 9's ratchet: the whole suite (including the
      # subprocess selftest runner and the LIVE_SELFTESTS harness, SDK
      # present) under subprocess-aware coverage, then the real-money floors
      # only ratchet UP. One run is the regression net AND the floor input.
      - name: Run the suite under subprocess-aware coverage
        run: |
          mkdir -p /tmp/covhook
          printf 'import coverage\ncoverage.process_startup()\n' > /tmp/covhook/sitecustomize.py
          printf '[run]\nparallel = true\nsource = %s\nomit =\n    */tests/*\n    */conftest.py\n' "$GITHUB_WORKSPACE" > /tmp/coveragerc
          COVERAGE_PROCESS_START=/tmp/coveragerc PYTHONPATH=/tmp/covhook python -m coverage run --rcfile=/tmp/coveragerc -m pytest -p no:cacheprovider
          python -m coverage combine --rcfile=/tmp/coveragerc
          python -m coverage report --rcfile=/tmp/coveragerc
          python -m coverage json --rcfile=/tmp/coveragerc -o coverage.json
      - name: Hold the floors
        run: python scripts/audit_coverage_floors.py coverage.json
