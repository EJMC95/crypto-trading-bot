name: fleet-watchdog
# Deterministic, zero-token fleet monitor (every ~30 min). Probes the public
# pnl.json feed; on problems it opens/updates ONE GitHub issue (label:
# fleet-watchdog) and closes it on recovery — transition alerts, no email storms.
# Per-bot "stale" flags come from the dashboard's own per-kind thresholds, so
# future services (e.g. lighter-*) are covered automatically once they publish.
#
# [2026-08-05] It is ALSO the CI-liveness dead-man's switch: the first step
# writes bot_state 'actions-heartbeat' each hourly run, and the IN-SERVICE
# watchdog (fleet_watchdog_svc on Railway — unaffected by a GitHub outage)
# pages the ntfy topic when the beat goes 12h silent (the MEASURED bar —
# free-tier schedule delivery runs p95 5.8h/max 21.5h, see
# fleet_watchdog_svc.ACTIONS_HB_MAX_S; main-push CI runs also beat the key
# via changelog-check.yml, so 12h dark means NOTHING is running). A billing lockout kills
# every workflow INCLUDING this one (28-Jul: 3-16s not-started "failures",
# no email), so no Actions-side check can detect it — I13, liveness is only
# visible from outside.
on:
  schedule:
    - cron: '7 * * * *'  # hourly since 28-Jul-2026: twice-hourly emptied the Free-plan minute quota (Jul-28 billing lockout); pnl-dashboard's in-service 5-min watchdog is the fine-grained layer
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actions-liveness heartbeat -> bot_state (dead-man's switch)
        # [2026-08-05] Upserts bot_state 'actions-heartbeat' {updated, ttl_sec,
        # run_id} via the SAME secret pattern as db-backup.yml (project token
        # -> `railway variables` -> DATABASE_PUBLIC_URL; no new secrets, no
        # unauthenticated write endpoint). Consumed by
        # fleet_watchdog_svc.actions_heartbeat_problem (LATE warning at 4h,
        # DARK page at 12h — measured bars) and shown on /vitals as a
        # critical organ (ttl 14400).
        # continue-on-error is DELIBERATE and is not the (gl) warning-guard
        # trap: enforcement is the dead-man's switch itself — if this step
        # breaks, the beat goes stale and the Railway-side pager fires within
        # 12h (LATE warning from 4h), out of band of any green/red run. A red step here must never
        # stop the fleet probe below. Shell installer first (seconds), npm
        # fallback (db-backup's proven path) — hourly minutes are the budget
        # that caused the 28-Jul lockout, so keep this step lean.
        continue-on-error: true
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          curl -fsSL https://railway.app/install.sh | sh >/dev/null 2>&1 || true
          command -v railway >/dev/null 2>&1 || npm install -g @railway/cli >/dev/null 2>&1
          command -v railway >/dev/null 2>&1 || { echo "::error::railway CLI unavailable — heartbeat not written (svc pager fires if this persists ~12h)"; exit 1; }
          if [ -n "${RAILWAY_PROJECT_TOKEN:-}" ]; then
            export RAILWAY_TOKEN="$RAILWAY_PROJECT_TOKEN"; unset RAILWAY_API_TOKEN || true
          fi
          URL=""
          for svc in Postgres postgres PostgreSQL; do
            URL=$(railway variables --service "$svc" --json 2>/dev/null \
                  | jq -r '[.. | objects | to_entries[] | select(.key=="DATABASE_PUBLIC_URL") | .value] | first // empty') && [ -n "$URL" ] && break
          done
          [ -n "$URL" ] || { echo "::error::no DATABASE_PUBLIC_URL resolved — heartbeat not written (svc pager fires if this persists ~12h)"; exit 1; }
          echo "::add-mask::$URL"
          UPDATED=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          psql "$URL" -v ON_ERROR_STOP=1 -q -c "
            INSERT INTO bot_state (bot, updated_at, state) VALUES ('actions-heartbeat', now(),
              jsonb_build_object('updated', '${UPDATED}', 'ttl_sec', 14400,
                                 'run_id', '${RUN_ID}', 'src', 'fleet-watchdog.yml'))
            ON CONFLICT (bot) DO UPDATE SET updated_at = now(), state = EXCLUDED.state;"
          echo "actions-heartbeat written (run ${RUN_ID}, ${UPDATED})"

      - name: Probe fleet feed
        shell: bash
        run: |
          set -uo pipefail
          URL="https://pnl-dashboard-production-858c.up.railway.app/pnl.json?nc=$(date +%s)"
          RESP=""
          for i in 1 2 3; do
            if RESP=$(curl -fsS -m 20 "$URL"); then break; fi
            echo "fetch attempt $i failed"; sleep 15
          done
          if [ -z "$RESP" ]; then
            echo "FEED UNREACHABLE after 3 attempts - dashboard or Railway may be DOWN" > problems.txt
            : > warnings.txt
            echo "(no data)" > snapshot.txt
            exit 0
          fi
          printf '%s' "$RESP" > pnl.json
          python3 - <<'PY'
          import json
          d = json.load(open('pnl.json'))
          meta = d.get('meta', {})
          bots = d.get('bots', [])
          problems, warnings = [], []
          if meta.get('feed_stale'):
              problems.append(f"FEED STALE (freshest={meta.get('freshest_update_age_sec')}s)")
          if not bots:
              problems.append("NO BOTS in feed")
          stale = sorted(b.get('bot','?') for b in bots if b.get('stale'))
          # [2026-08-19 (rn)] accepted set mirrors fleet_watchdog_svc's own
          # 16-Jul audit fix ("halted is the NORMAL daily-loss state ... they
          # paged as NOT ONLINE all day"; 'paper' is the hl_paper resting
          # status). This copy predated that fix and had drifted — the (hj)
          # second-copy-of-a-rule class, found while adding the reader check.
          off   = sorted(b.get('bot','?') for b in bots if b.get('status') not in (None, 'online', 'halted', 'paper'))
          halted = sorted(b.get('bot','?') for b in bots if b.get('status') == 'halted')
          if stale: problems.append("STALE: " + ", ".join(stale))
          if off:   problems.append("NOT ONLINE: " + ", ".join(off))
          if halted: warnings.append("halted (daily-loss rule): " + ", ".join(halted))
          opens = sum(int(b.get('open_trades') or 0) for b in bots)
          if opens > 20:
              warnings.append(f"open positions {opens} exceed the 20-position budget")
          big = [f"{b.get('bot')} ({b.get('pnl_daily'):+.1f})" for b in bots
                 if isinstance(b.get('pnl_daily'), (int, float)) and b['pnl_daily'] < -100]
          if big:
              warnings.append("daily P&L below -$100: " + ", ".join(big))
          open('problems.txt','w').write("\n".join(problems))
          open('warnings.txt','w').write("\n".join(warnings))
          open('snapshot.txt','w').write(f"bots={len(bots)} open_positions={opens} freshest={meta.get('freshest_update_age_sec')}s")
          print("problems:", problems or "none"); print("warnings:", warnings or "none")
          PY

      - name: Reader currency — was a pnl-dashboard deploy missed?
        # [2026-08-19 (rn)] THE CLASS THIS CLOSES, measured live the same day:
        # a red/frozen redeploy run leaves the SERVING dashboard on code older
        # than main's registrations, and every row registered since is
        # silently FILTERED from /pnl.json — the (rl) freeze ate the (rj)
        # dashboard deploy and 🧭 nav-cook published invisibly behind a 06:27Z
        # reader for ~2h until a manual catch-up dispatch. The (qh)
        # reader-verify step cannot see this: it runs only when a deploy
        # INCLUDES pnl-dashboard, and the failure here is a dashboard deploy
        # that never started. This check runs hourly from OUTSIDE, deploy or
        # no deploy (I13: liveness is only visible from outside).
        # DASH_FILES mirrors railway-redeploy.yml's pnl-dashboard decide grep
        # — a second copy of the routing rule, so it is drift-pinned by
        # tests/autonomy/test_reader_currency_check.py ((hj)).
        # FAIL-OPEN with a visible SKIP line: an unreachable watchdog.json is
        # the feed probe's page, not this one's; only a POSITIVE stale reading
        # appends a problem. GRACE covers build+boot so a fresh merge is not a
        # false page (worst-case detection ~2 cycles).
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          GRACE_S=1800
          DASH_FILES="pnl_dashboard.py report_emailer.py compile_market_data.py bot_pnl_store.py Dockerfile.dashboard fleet_watchdog_svc.py"
          STARTED=$(curl -fsS -m 20 "https://pnl-dashboard-production-858c.up.railway.app/watchdog.json" 2>/dev/null \
                    | python3 -c 'import json,sys;print(json.load(sys.stdin).get("started",""))' 2>/dev/null || true)
          if [ -z "$STARTED" ]; then
            echo "reader-currency: SKIP (watchdog.json unreachable — the feed probe owns that page)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          NEWEST=""
          for f in $DASH_FILES; do
            d=$(gh api "repos/$REPO/commits?path=$f&sha=main&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)
            if [ -n "$d" ] && [ "$d" \> "$NEWEST" ]; then NEWEST="$d"; fi
          done
          if [ -z "$NEWEST" ]; then
            echo "reader-currency: SKIP (commit API returned nothing — verified nothing, not clean)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$STARTED" "$NEWEST" "$GRACE_S" <<'PY'
          import sys, datetime as dt
          started_s, newest_s, grace = sys.argv[1], sys.argv[2], int(sys.argv[3])
          parse = lambda s: dt.datetime.fromisoformat(s.replace("Z", "+00:00"))
          now = dt.datetime.now(dt.timezone.utc)
          started, newest = parse(started_s), parse(newest_s)
          if (now - newest).total_seconds() > grace and started < newest:
              msg = ("DASHBOARD READER STALE: serving container booted %s but main moved its "
                     "files at %s — a pnl-dashboard deploy was missed, so rows registered since "
                     "are silently filtered from /pnl.json; re-dispatch railway-redeploy with "
                     "services=pnl-dashboard" % (started_s, newest_s))
              prev = open("problems.txt").read()
              with open("problems.txt", "a") as f:
                  f.write(("\n" if prev and not prev.endswith("\n") else "") + msg)
              print("reader-currency: STALE — " + msg)
          else:
              print("reader-currency: OK (reader %s vs newest dash commit %s)" % (started_s, newest_s))
          PY

      - name: Transition-aware alerting via single issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          PROB=$(cat problems.txt); WARN=$(cat warnings.txt); SNAP=$(cat snapshot.txt)
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh label create fleet-watchdog --repo "$REPO" --color D93F0B --description "automated fleet monitor" 2>/dev/null || true
          NUM=$(gh issue list --repo "$REPO" --label fleet-watchdog --state open --json number -q '.[0].number' || true)
          {
            echo "## Fleet watchdog"
            echo "**Last check:** $NOW · $SNAP"
            if [ -n "$PROB" ]; then echo; echo "### 🚨 Problems"; echo "$PROB" | sed 's/^/- /'; fi
            if [ -n "$WARN" ]; then echo; echo "### ⚠️ Warnings (non-fatal)"; echo "$WARN" | sed 's/^/- /'; fi
            echo; echo "_Opened/maintained automatically by fleet-watchdog; closes itself on recovery._"
          } > body.md
          if [ -n "$PROB" ]; then
            if [ -z "$NUM" ]; then
              gh issue create --repo "$REPO" --label fleet-watchdog \
                --title "🚨 fleet-watchdog: $(echo "$PROB" | head -1 | cut -c1-80)" \
                --body-file body.md
              echo "issue created"
            else
              gh issue edit "$NUM" --repo "$REPO" --body-file body.md >/dev/null
              echo "issue #$NUM updated quietly"
            fi
          else
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --repo "$REPO" --comment "✅ Recovered — all bots fresh at $NOW · $SNAP"
              echo "issue #$NUM closed (recovered)"
            else
              echo "fleet OK — nothing to do"
            fi
          fi
          echo "$SNAP" >> "$GITHUB_STEP_SUMMARY"
