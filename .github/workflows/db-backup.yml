name: DB Backup

# [2026-07-15 — operator-queue item: "verify Railway Postgres backups exist"]
# Nightly logical backup of the fleet's Postgres (EVERY ledger + all brain
# memory lives there: bot_pnl, bot_trades, paper_trades, venue_orders,
# bot_state, bot_state_history). Railway's own PITR/backup story is
# plan-dependent and unverified from here — this workflow makes the fleet
# independent of it: pg_dump via the Railway CLI's variable injection
# (reusing the SAME account-token pattern as railway-volume.yml; no new
# secrets), uploaded as a private-repo artifact, 30-day retention.
#
# Restore: download the artifact, then
#   pg_restore --no-owner --dbname "$NEW_DATABASE_URL" bot_fleet.dump
#
# Runs 18:07 UTC daily = 04:07 AEST (quiet hour for the fleet), plus manual
# workflow_dispatch for on-demand backups / testing.

on:
  schedule:
    - cron: '7 18 * * *'
  workflow_dispatch:
    inputs:
      db_service:
        description: "Railway database service name"
        required: false
        default: "Postgres"

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Railway CLI (retry — see railway-volume.yml)
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge 5 ]; do
            if npm install -g @railway/cli; then
              railway upgrade --yes 2>&1 || echo "(upgrade skipped; npm build ok)"
              echo "Railway CLI: $(railway --version || echo unknown)"
              exit 0
            fi
            n=$((n+1)); echo "install attempt $n failed; retry in $((n*3))s"; sleep $((n*3))
          done
          echo "::error::Railway CLI install failed after retries"; exit 1

      - name: Resolve DATABASE_URL (never printed) and pg_dump
        env:
          # [2026-07-15 run-1 fix] The ACCOUNT token secret is dead
          # ("Unauthorized" — railway-volume.yml already called it
          # unreliable). The PROJECT token works (railway-redeploy.yml uses
          # it daily) and reads service variables WITHOUT linking, so it is
          # primary; the account token stays as a fallback path.
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          PROJECT: 9b3b7d3c-28db-417b-b864-ebc065df851f
          DB_SERVICE: ${{ github.event.inputs.db_service || 'Postgres' }}
        run: |
          set -uo pipefail
          if [ -n "${RAILWAY_PROJECT_TOKEN:-}" ]; then
            export RAILWAY_TOKEN="$RAILWAY_PROJECT_TOKEN"
            unset RAILWAY_API_TOKEN || true
            echo "auth: project token"
          elif [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            unset RAILWAY_TOKEN || true
            echo "auth: account token (fallback)"
            railway link --project "$PROJECT" --environment production --service "$DB_SERVICE" </dev/null 2>&1 || true
          else
            echo "::error::neither RAILWAY_TOKEN nor RAILWAY_ACCOUNT_TOKEN secret is set."
            exit 1
          fi
          # Service-name diagnostics (names only — never variable values).
          railway status --json > /tmp/st.json 2>/dev/null || true
          echo "services in project: $(jq -r '[.. | objects | select(has("name")) | .name] | unique | join(", ")' /tmp/st.json 2>/dev/null | head -c 400 || echo '?')"
          vars_ok=""
          for svc in "$DB_SERVICE" Postgres postgres PostgreSQL postgres-db; do
            if railway variables --service "$svc" --json > /tmp/vars.json 2>/tmp/vars.err; then
              echo "variables read from service '$svc'"; vars_ok=1; break
            fi
          done
          if [ -z "$vars_ok" ]; then
            cat /tmp/vars.err 2>/dev/null || true
            echo "::error::could not read variables for a DB service — re-dispatch with the right db_service name (see the service list above)."
            exit 1
          fi
          # Prefer the PUBLIC url (GitHub runners can't reach railway.internal).
          URL="$(jq -r '[.. | objects | to_entries[] | select(.key=="DATABASE_PUBLIC_URL") | .value] | first // empty' /tmp/vars.json)"
          [ -n "$URL" ] || URL="$(jq -r '[.. | objects | to_entries[] | select(.key=="DATABASE_URL") | .value | select(test("railway.internal")|not)] | first // empty' /tmp/vars.json)"
          rm -f /tmp/vars.json
          if [ -z "$URL" ]; then
            echo "::error::no externally-reachable DATABASE_(PUBLIC_)URL on service '$DB_SERVICE' — check the service name / enable the TCP proxy on the DB service."
            exit 1
          fi
          echo "::add-mask::$URL"
          # [run-3 fix] Railway's Postgres is 18.4 and pg_dump must be >=
          # server. The runner's apt only reached client 16 (the silent
          # 2>/dev/null install-failure was runs 2-3's lesson) — so run
          # pg_dump inside a pinned postgres:18 container instead: version
          # drift eliminated. Bump the tag if the server ever upgrades.
          export PGURL="$URL"
          docker run --rm -e PGURL postgres:18-alpine \
            sh -c 'pg_dump --no-owner --format=custom --dbname "$PGURL"' \
            > bot_fleet.dump
          ls -la bot_fleet.dump
          echo "backup OK: $(stat -c%s bot_fleet.dump) bytes"

      - name: Upload backup artifact (private repo, 30d retention)
        uses: actions/upload-artifact@v4
        with:
          name: pg-backup-${{ github.run_id }}
          path: bot_fleet.dump
          retention-days: 30
          if-no-files-found: error
