# One-shot provisioning for 👩 mum's LIVE arm — DELETE AFTER USE (the (lr)
# rule: an armed provisioning tool is how a service gets resurrected by
# accident). [2026-08-25 (te)] A faithful copy of the nav-cook provisioner
# (itself the final books-provision shape with every (ml) postmortem fix:
# no grep -q pipelines under pipefail, no variables read-back echo — logs
# carry variable NAMES only, the --set exit code is the check), extended for
# a REAL-MONEY service: the venue credentials arrive as workflow_dispatch
# INPUTS at run time, are mapped straight into `railway variables --set`,
# and are never echoed, logged, or written to any file. They exist in the
# repo at no point.
#
# Eamon's launch order, 25-Aug: "Here are all the details you need to make
# mum v2 live — full permission to populate wherever necessary."
#
# A green run here is NOT a running book — the proof is the row
# freqtrade-mum-lighter publishing on /pnl.json with extra.venue=lighter_live
# and an extra.build stamp matching the local prediction ((iw)/(fd): compare
# build AND build_n against the avolive image's own COPY set).
name: Provision mum-live
on:
  workflow_dispatch:
    inputs:
      account_index:
        description: "Lighter sub-account index"
        required: true
        type: string
      api_key_index:
        description: "Lighter API key index"
        required: true
        type: string
      api_private_key:
        description: "Lighter API private key (env only — never in the repo)"
        required: true
        type: string
      max_notional:
        description: "FREQTRADE_MUM_MAX_NOTIONAL (hard boot gate)"
        required: false
        default: "1000"
        type: string
      gross_x:
        description: "MUM_GROSS_X (1.0 = unlevered; ceiling 10, stop dead AT 10)"
        required: false
        default: "1.0"
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Create service, set variables, first deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IN_ACCT: ${{ inputs.account_index }}
          IN_KEYIX: ${{ inputs.api_key_index }}
          IN_PRIVKEY: ${{ inputs.api_private_key }}
          IN_CAP: ${{ inputs.max_notional }}
          IN_GROSS: ${{ inputs.gross_x }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set"; exit 1
          fi
          if [ -z "${IN_PRIVKEY:-}" ] || [ -z "${IN_ACCT:-}" ]; then
            echo "::error::credential inputs missing"; exit 1
          fi
          SVC="mum-live"
          DF="Dockerfile.avolive"

          echo "::group::$SVC — create (tolerated if it already exists)"
          railway add --service "$SVC" || railway add -s "$SVC" || \
            echo "railway add failed — service may already exist; continuing to verify"
          echo "::endgroup::"

          echo "::group::$SVC — verify the service resolves"
          status_json="$(railway status --json || true)"
          case "$status_json" in
            *"\"$SVC\""*) : ;;
            *)
              echo "::error::service '$SVC' did not resolve after create"
              printf '%s\n' "$status_json" | head -50
              exit 1
              ;;
          esac
          echo "::endgroup::"

          echo "::group::$SVC — set variables (names only in this log)"
          # DATABASE_URL REFERENCE form ((kb)) assembled in shell so GitHub's
          # own expression parser never sees the token.
          DB_REF="$(printf '$%s' '{{Postgres.DATABASE_URL}}')"
          railway variables --service "$SVC" \
            --set "FAMILY_LIVE_BOOK=freqtrade-mum" \
            --set "MUM_VENUE=lighter_live" \
            --set "FREQTRADE_MUM_MAX_NOTIONAL=${IN_CAP}" \
            --set "MUM_GROSS_X=${IN_GROSS}" \
            --set "REAL_MONEY_KILL=DISARMED_I_UNDERSTAND" \
            --set "LIGHTER_ACCOUNT_INDEX=${IN_ACCT}" \
            --set "LIGHTER_API_KEY_INDEX=${IN_KEYIX}" \
            --set "LIGHTER_API_PRIVATE_KEY=${IN_PRIVKEY}" \
            --set "RAILWAY_DOCKERFILE_PATH=${DF}" \
            --set "DATABASE_URL=${DB_REF}" \
            --skip-deploys || { echo "::error::$SVC variable set failed"; exit 1; }
          echo "set: FAMILY_LIVE_BOOK MUM_VENUE FREQTRADE_MUM_MAX_NOTIONAL"
          echo "set: MUM_GROSS_X REAL_MONEY_KILL LIGHTER_ACCOUNT_INDEX"
          echo "set: LIGHTER_API_KEY_INDEX LIGHTER_API_PRIVATE_KEY"
          echo "set: RAILWAY_DOCKERFILE_PATH DATABASE_URL"
          echo "::endgroup::"

          echo "::group::$SVC — first deploy"
          ok=0
          for i in 1 2 3; do
            if railway up --service "$SVC" --ci; then ok=1; break; fi
            echo "retry $i failed; sleeping"; sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$SVC railway up failed x3"; exit 1
          fi
          echo "::endgroup::"
          echo "Provisioned. Verify by the ROW: freqtrade-mum-lighter on"
          echo "/pnl.json with extra.venue=lighter_live and a build stamp —"
          echo "a green run is NOT that proof."
