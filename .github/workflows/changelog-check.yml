name: Changelog check

# Parallel Claude sessions edit this repo; CHANGELOG.md is how they stay in sync.
# Fail the build if a PR/push changes bot-affecting code without logging it.
#
# [2026-07-17] Also runs the BORN-DARK guard. Three incidents in three days
# (fleet_bus 15-Jul, event_sentinel 16-Jul, brain_stats 17-Jul) all shipped
# code the IMAGE never contained; the fleet's correct try/except import
# guards made every one SILENT rather than a crash. A rule that says
# "remember to run the audit" is the same control that already failed three
# times — so it runs here, on every push/PR. Stdlib-only, milliseconds.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  born-dark:
    name: Born-dark guard (image imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every image must contain the modules its code imports
        run: python3 scripts/audit_image_imports.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_image_imports.py --selftest

  sdk-pin:
    name: Real-money wheels are PINNED (no signer drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-17] lighter-sdk was `>=1.1.1`, so every image resolved to
      # PyPI's latest on BUILD DAY — 1.1.2 shipped 10-Jul and silently became
      # the code SIGNING REAL ORDERS. The born-dark guard cannot see a pip dep
      # (its own docstring: it "verified the FILE and not the WHEEL"), so this
      # is the sibling control for the layer it is blind to.
      - name: A wheel that signs real orders must not float
        run: python3 scripts/audit_sdk_pin.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_sdk_pin.py --selftest

  doctrine:
    name: Every invariant names what enforces it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-31 (hy)] operator: "all of the breakthroughs and milestones we
      # reach must be doctrines that serve as building blocks so we stop this
      # perpetual cycle of going back to the same square one routine."
      # Measured that day: 31 rule-shaped doctrines vs 7 executable guards —
      # and in the same session TWO written rules were read and violated
      # anyway, while every defect actually caught came from a guard, a
      # selftest, a mutation, or a live payload. Prose is remembered or it is
      # not; this job is what makes an invariant a building block. The second
      # arm is the load-bearing one: it fails when an enforcement reference no
      # longer resolves, so a guard deleted out from under its doctrine is
      # caught rather than leaving the rule quietly toothless.
      - name: A doctrine with no enforcement is prose, and prose gets re-learned
        run: python3 scripts/audit_doctrine_enforcement.py
      - name: The guard must still be able to see (negative fixtures)
        run: python3 scripts/audit_doctrine_enforcement.py --selftest

  recurrence:
    name: The changelog must not keep returning to the same house
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-31 (hz)] operator: "we are fixing the same issues daily and
      # it's just costing me money ... when we make progress on construction we
      # don't forget it and go try and work on a random house the next day."
      # MEASURED that day: perps-funding-carry in 16 entries in 7 days. The
      # pathology is invisible per-entry -- every one was a legitimate fix --
      # and only exists in aggregate, so no other guard in this repo can see
      # it. A subject over threshold must earn an enforced INVARIANT or an
      # explicit reasoned acknowledgement; both are cheap, neither is silence.
      - name: A subject we keep returning to is a class that never closed
        run: python3 scripts/audit_recurrence.py
      - name: The guard must still be able to see (negative fixtures)
        run: python3 scripts/audit_recurrence.py --selftest

  lever-bounds:
    name: Every lever cage fits the value its consumer runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-30] A lever is three things that must agree: the registry
      # cage, the declared default, and the `os.environ.get` default the bot
      # actually runs. Only the cage was ever machine-readable; the default
      # lived in prose and the consumer's value lived in another file, so
      # drift was undetectable — and had already happened.
      - name: Registry cage, declared default and consumer default must agree
        run: python3 scripts/audit_lever_bounds.py
      - name: The guard must still be able to see (negative fixtures)
        run: python3 scripts/audit_lever_bounds.py --selftest

  venue-purity:
    name: LIGHTER-FIRST (no foreign market data in shipped code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-18] The LIGHTER-FIRST rule (CLAUDE.md, user decision 14-Jul)
      # had a detective control since 17-Jul but it was never wired in, so it
      # rotted red on main unnoticed. Now enforced on SHIPPED code: every
      # foreign market-data source must be Lighter, infrastructure, or DECLARED
      # in VENUE_PURITY_OK. The backtest section stays ADVISORY (does not fail
      # the build) — that triage is a separate, larger effort.
      - name: Shipped code must trade the venue it measures
        run: python3 scripts/audit_venue_purity.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_venue_purity.py --selftest

  deploy-coverage:
    name: Every shipped file has a deploy path (no silent orphans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-23] fleet_radar.py shipped in the freqtrade-bots image (cl/cm/cn)
      # but was in NEITHER railway-redeploy.yml `paths:` NOR its service grep, so
      # editing it was a silent no-op: green CI, old code still running. The
      # audit that catches this (audit_deploy_coverage.py) EXISTED and had a
      # --selftest, but — exactly like venue-purity before 18-Jul — was never
      # RUN by CI, so it rotted undetected. A detective control nobody executes
      # is not a control. Now enforced: a file that ships but cannot deploy fails
      # the build (declare intentional omissions in DEPLOY_COVERAGE_OK).
      - name: A file in an auto-deployed image must be reachable by a push path
        run: python3 scripts/audit_deploy_coverage.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_deploy_coverage.py --selftest

  changelog-letters:
    name: CHANGELOG entry letters are unique (citations must resolve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-29 (fd)] Entries cite each other BY LETTER, and tracked CODE
      # cites them too (railway-redeploy.yml -> "(ff)", test_selftests.py ->
      # "(ex)"), so a duplicate makes every such reference ambiguous. It has
      # happened at least SEVEN times — including a 23-Jul QUADRUPLE whose own
      # merge note promised a follow-up that then sat unrepaired for six days,
      # and twice in one afternoon on 29-Jul. Every instance was caught by a
      # human reading the file, and the rule was written nowhere a session
      # reads BEFORE writing: the control that kept failing was "remember to
      # check". Same shape as born-dark, same answer — run the detector.
      - name: A duplicated entry letter must fail the build
        run: python3 scripts/audit_changelog_letters.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_changelog_letters.py --selftest

  conflict-markers:
    name: No unresolved merge/stash markers in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-22] CHANGELOG.md — the sync channel between parallel Claude
      # sessions — carried three COMMITTED stash-conflict markers for SEVEN
      # commits (31cf1ca 18:26 Sydney through c86621a), and this workflow
      # reported `completed/success` on every one of them. The reason is
      # structural: the `changelog` job below only asserts CHANGELOG.md APPEARS
      # in the changed-file list — it never reads a byte of content. A guard
      # that checks EXISTENCE, not CONTENT, is not a guard.
      # Scans every tracked file, not just the changelog: an unresolved marker
      # is a defect anywhere, and in a .py file it is a SyntaxError that would
      # ship to a real-money image.
      - name: A committed conflict marker must fail the build
        run: |
          set -uo pipefail
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======$)' -- . ; then
            echo "::error::Unresolved merge/stash conflict markers are committed (listed above)."
            echo "Resolve them. NOTE: when a marker line sits between a bullet and a '## ' header,"
            echo "REPLACE it with a blank line rather than deleting it, or the entry renders glued"
            echo "into the previous one (the (bq) bug, 2026-07-22)."
            exit 1
          fi
          echo "OK: no conflict markers in any tracked file."
      - name: The guard must still be able to see (negative fixture)
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          printf '%s\n' '<<<<<<< Updated upstream' 'a' '=======' 'b' '>>>>>>> Stashed changes' > "$tmp/fixture.md"
          git -C "$tmp" init -q . && git -C "$tmp" add fixture.md
          if git -C "$tmp" grep -nE '^(<<<<<<<|>>>>>>>|=======$)' -- . >/dev/null; then
            echo "OK: guard detects planted markers."
          else
            echo "::error::Guard is BLIND — it failed to flag a planted conflict marker."
            exit 1
          fi

  secret-leak:
    name: No credential reaches a commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-29] Credentials reached commits THREE times (14/15/16-Jul) via
      # `.claude/settings.local.json`, which stores approved commands VERBATIM —
      # a live Postgres URL accumulated into the working copy one `git add .`
      # from being permanent. Gitignoring that file (b88be6b) stopped THAT
      # bleed; nothing stopped the next one, and "remember not to paste secrets"
      # is the same control that already failed 3x.
      #
      # The local pre-commit hook (scripts/install_git_hooks.sh) is the fast
      # catch; .git/hooks is untracked, so it cannot be shipped by committing
      # it — THIS job is the backstop for any clone/worktree that never ran the
      # installer.
      #
      # MEASURED 29-Jul: gitleaks' DEFAULT ruleset scans a full Postgres
      # connection URI carrying an inline password CLEAN — exactly the
      # credential class that leaked here. .gitleaks.toml adds that rule (plus
      # private-key, bare-AKIA and railway-token, all also missed by default).
      - name: Install gitleaks (pinned + checksum-verified)
        run: scripts/install_git_hooks.sh --with-gitleaks
      - name: No secrets in the tree
        run: python3 scripts/audit_secret_leak.py
      # The guard must still be able to see. The FIRST draft of the allowlist
      # matched the whole LINE against words like "example", and a live GitHub
      # PAT trailing `# example config` sailed straight through. This fixture
      # is what caught it — it is a regression test for a real near-miss.
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_secret_leak.py --selftest

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff
      - name: Require a CHANGELOG.md entry for bot-affecting changes
        run: |
          set -uo pipefail
          # Compare against the parent commit (push) or the PR base.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            range="$base...HEAD"
          else
            range="HEAD^ HEAD"
          fi
          changed="$(git diff --name-only $range 2>/dev/null || echo '')"
          echo "Changed files:"; echo "$changed"
          # Bot-affecting paths that require a changelog note.
          bot_touched="$(echo "$changed" | grep -E '^(user_data/|.*\.py$|.*\.sh$|Dockerfile.*)$' | grep -vE '^(CHANGELOG\.md|CLAUDE\.md|.*_test\.py|test_.*\.py)$' || true)"
          if [ -z "$bot_touched" ]; then
            echo "No bot-affecting files changed — changelog not required."
            exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "OK: bot-affecting change includes a CHANGELOG.md entry."
            exit 0
          fi
          echo "::error::This change touches bot code but does not update CHANGELOG.md."
          echo "Bot-affecting files without a changelog entry:"; echo "$bot_touched"
          echo "Add a dated one-line entry to CHANGELOG.md in this commit (see CLAUDE.md)."
          exit 1
