name: Changelog check

# Parallel Claude sessions edit this repo; CHANGELOG.md is how they stay in sync.
# Fail the build if a PR/push changes bot-affecting code without logging it.
#
# [2026-07-17] Also runs the BORN-DARK guard. Three incidents in three days
# (fleet_bus 15-Jul, event_sentinel 16-Jul, brain_stats 17-Jul) all shipped
# code the IMAGE never contained; the fleet's correct try/except import
# guards made every one SILENT rather than a crash. A rule that says
# "remember to run the audit" is the same control that already failed three
# times — so it runs here, on every push/PR. Stdlib-only, milliseconds.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  born-dark:
    name: Born-dark guard (image imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every image must contain the modules its code imports
        run: python3 scripts/audit_image_imports.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_image_imports.py --selftest

  sdk-pin:
    name: Real-money wheels are PINNED (no signer drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-17] lighter-sdk was `>=1.1.1`, so every image resolved to
      # PyPI's latest on BUILD DAY — 1.1.2 shipped 10-Jul and silently became
      # the code SIGNING REAL ORDERS. The born-dark guard cannot see a pip dep
      # (its own docstring: it "verified the FILE and not the WHEEL"), so this
      # is the sibling control for the layer it is blind to.
      - name: A wheel that signs real orders must not float
        run: python3 scripts/audit_sdk_pin.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_sdk_pin.py --selftest

  venue-purity:
    name: LIGHTER-FIRST (no foreign market data in shipped code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [2026-07-18] The LIGHTER-FIRST rule (CLAUDE.md, user decision 14-Jul)
      # had a detective control since 17-Jul but it was never wired in, so it
      # rotted red on main unnoticed. Now enforced on SHIPPED code: every
      # foreign market-data source must be Lighter, infrastructure, or DECLARED
      # in VENUE_PURITY_OK. The backtest section stays ADVISORY (does not fail
      # the build) — that triage is a separate, larger effort.
      - name: Shipped code must trade the venue it measures
        run: python3 scripts/audit_venue_purity.py
      - name: The guard must still be able to see (negative fixture)
        run: python3 scripts/audit_venue_purity.py --selftest

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff
      - name: Require a CHANGELOG.md entry for bot-affecting changes
        run: |
          set -uo pipefail
          # Compare against the parent commit (push) or the PR base.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            range="$base...HEAD"
          else
            range="HEAD^ HEAD"
          fi
          changed="$(git diff --name-only $range 2>/dev/null || echo '')"
          echo "Changed files:"; echo "$changed"
          # Bot-affecting paths that require a changelog note.
          bot_touched="$(echo "$changed" | grep -E '^(user_data/|.*\.py$|.*\.sh$|Dockerfile.*)$' | grep -vE '^(CHANGELOG\.md|CLAUDE\.md|.*_test\.py|test_.*\.py)$' || true)"
          if [ -z "$bot_touched" ]; then
            echo "No bot-affecting files changed — changelog not required."
            exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "OK: bot-affecting change includes a CHANGELOG.md entry."
            exit 0
          fi
          echo "::error::This change touches bot code but does not update CHANGELOG.md."
          echo "Bot-affecting files without a changelog entry:"; echo "$bot_touched"
          echo "Add a dated one-line entry to CHANGELOG.md in this commit (see CLAUDE.md)."
          exit 1
