# One-shot tape fetcher for the 👩 mum-v2 founding study — DELETE AFTER USE
# (the (lr) rule: an armed one-shot tool left in the tree is how accidents
# happen; this one also never lands on main — it lives and dies on the study
# session's own branch).
#
# WHY THIS EXISTS: the venue's /api/v1/candlesticks endpoint is 403-blocked
# from the study session's egress while orderBookDetails/fundings/recentTrades
# are open, and pulling 35d of scout snapshots through /bus.json?hours= would
# make the LIVE pnl-dashboard build a ~400MB JSON body in memory — a real OOM
# risk on the fleet's reporting spine, refused. Actions runners have clean
# egress, so the tape is paged here and handed over on a THROWAWAY branch
# (tmp/mum-tape), which the session fetches and then deletes.
#
# A green run is NOT the data — the session verifies row counts per coin
# before using anything.
name: mum-tape-fetch
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Page 1h candles per market and push to tmp/mum-tape
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tape
          python3 - <<'PY'
          import gzip, json, time, urllib.request

          BASE = "https://mainnet.zklighter.elliot.ai/api/v1/candlesticks"
          MARKETS = {  # resolved from orderBookDetails 19-Aug (study session)
              "BTC": 1, "ETH": 0, "SOL": 2, "XRP": 7, "ADA": 39, "DOT": 11,
              "AVAX": 9, "LINK": 8, "LTC": 35, "NEAR": 10, "TRX": 43,
              "DOGE": 3, "AAVE": 27, "SUI": 16, "BNB": 25, "HYPE": 24,
              "SPY": 128, "QQQ": 129, "XAU": 92, "WTI": 145,
          }
          RES, STEP_S, PAGE = "1h", 3600, 500
          HORIZON_S = 460 * 86400          # ask past the ~438d tape start

          def get(url, tries=3):
              for k in range(tries):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return json.loads(r.read())
                  except Exception as e:            # noqa: BLE001
                      if k == tries - 1:
                          print(f"    GIVE UP {e} {url[:120]}")
                          return None
                      time.sleep(2 * (k + 1))

          now = int(time.time())
          shown_shape = False
          for coin, mid in MARKETS.items():
              rows, end = {}, now
              floor = now - HORIZON_S
              for _ in range(40):                   # 40 pages x 500 bars >> 438d
                  start = max(floor, end - PAGE * STEP_S)
                  d = get(f"{BASE}?market_id={mid}&resolution={RES}"
                          f"&start_timestamp={start}&end_timestamp={end}"
                          f"&count_back={PAGE}")
                  if not d:
                      break
                  c = d.get("candlesticks") or d.get("c") or []
                  if not shown_shape and c:
                      # the study session could never see this endpoint, so the
                      # raw shape is printed once for its parser to match
                      print("RAW CANDLE SHAPE:", json.dumps(c[0])[:400])
                      shown_shape = True
                  if not c:
                      break
                  ts_key = ("timestamp" if "timestamp" in c[0]
                            else "start_timestamp" if "start_timestamp" in c[0]
                            else "t")
                  new = 0
                  for row in c:
                      t = int(row.get(ts_key) or 0)
                      if t and t not in rows:
                          rows[t] = row
                          new += 1
                  oldest = min(int(r.get(ts_key) or 0) for r in c)
                  if new == 0 or oldest <= floor:
                      break
                  end = oldest                      # walk backward; dedup by ts
                  time.sleep(0.15)
              out = [rows[t] for t in sorted(rows)]
              with gzip.open(f"tape/{coin}_1h.jsonl.gz", "wt") as f:
                  for row in out:
                      f.write(json.dumps(row) + "\n")
              span_d = ((max(rows) - min(rows)) / 86400.0) if rows else 0.0
              print(f"{coin}: {len(out)} bars, {span_d:.0f} days")
          PY
          git config user.name "mum-tape-fetch"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B tmp/mum-tape
          git add -f tape
          git commit -m "tape: 1h candles for the mum-v2 founding study (throwaway branch)"
          git push -f origin tmp/mum-tape
          echo "pushed tmp/mum-tape"
