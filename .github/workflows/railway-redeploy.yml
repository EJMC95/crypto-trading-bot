name: Railway Redeploy

# Auto-deploy the LATEST main code to the Railway services whose Railway-side
# "Auto Deploy" is OFF (freqtrade-bots, pnl-dashboard). Every push to main runs
# this and `railway up`s those services, so merges deploy themselves — the same
# effect as Railway Auto Deploy, driven from GitHub (which the CLI/token can do,
# whereas toggling Railway's own Auto Deploy is a dashboard-only setting).
#
# The other services (perps-bot, momo-bot, arbs, sniper) already auto-deploy via
# Railway's native GitHub integration, so they are intentionally NOT listed here
# to avoid double-deploys.
#
# Note: `railway redeploy` only re-runs a service's CURRENT (old) deployment, so
# it does NOT ship new code — we use checkout + `railway up` (fresh build) instead.
# The `railway status` step prints exact service names for reference.
#
# SETUP (one time, already done): RAILWAY_TOKEN repo secret = a Railway PROJECT
# token (repo Settings -> Secrets and variables -> Actions).
#
# USAGE: automatic on every push to main; or Actions tab -> Run workflow to deploy
# a custom service list; or dispatch via the GitHub API.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated Railway service names to deploy (see the 'List services' step output for exact names)"
        required: false
        default: "freqtrade-bots,pnl-dashboard"

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: List services in the project (for exact names)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set (Settings > Secrets and variables > Actions, use a Railway PROJECT token)."
            exit 1
          fi
          echo "Railway CLI version: $(railway --version || echo unknown)"
          echo "----- railway status -----"
          railway status || true
          echo "----- railway status --json -----"
          railway status --json || true

      - name: Deploy latest code to services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # On push (auto-deploy) inputs.services is empty -> fall back to the two
          # services that lack Railway-side Auto Deploy.
          SERVICES: ${{ github.event.inputs.services || 'freqtrade-bots,pnl-dashboard' }}
        run: |
          set -uo pipefail
          fail=0
          IFS=',' read -ra SVCS <<< "$SERVICES"
          for raw in "${SVCS[@]}"; do
            svc="$(echo "$raw" | xargs)"   # trim whitespace
            [ -z "$svc" ] && continue
            echo "::group::railway up --service '$svc'"
            if railway up --service "$svc" --ci; then
              echo "OK: '$svc' deployed (latest main)"
            else
              echo "::error::deploy failed for '$svc' — check the exact name in the 'List services' step above."
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more services failed to deploy."
            exit 1
          fi
          echo "All requested services deployed from latest main."
