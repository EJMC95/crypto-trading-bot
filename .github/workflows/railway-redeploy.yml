name: Railway Redeploy

# Deploy the LATEST main code to Railway services that don't auto-deploy.
#
# Note: `railway redeploy` only re-runs a service's CURRENT (possibly old)
# deployment, so it does NOT ship newly-merged code. This workflow instead checks
# out the latest main and runs `railway up`, which uploads the current source and
# builds a fresh deployment — shipping the new code even when Auto Deploy is off.
#
# It also prints `railway status` so the exact service names in the token's
# project are visible in the logs (service names are case-sensitive and often
# differ from the tile label).
#
# SETUP (one time): add a Railway PROJECT token as the RAILWAY_TOKEN repo secret
# (repo Settings -> Secrets and variables -> Actions). A project token is scoped
# to one project+environment, which is what CI should use.
#
# USAGE: Actions tab -> "Railway Redeploy" -> Run workflow (optionally override
# the comma-separated service list), or dispatch it via the GitHub API.

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated Railway service names to deploy (see the 'List services' step output for exact names)"
        required: true
        default: "pnl-dashboard"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: List services in the project (for exact names)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set (Settings > Secrets and variables > Actions, use a Railway PROJECT token)."
            exit 1
          fi
          echo "Railway CLI version: $(railway --version || echo unknown)"
          echo "----- railway status -----"
          railway status || true
          echo "----- railway status --json -----"
          railway status --json || true

      - name: Deploy latest code to services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -uo pipefail
          fail=0
          IFS=',' read -ra SVCS <<< "$SERVICES"
          for raw in "${SVCS[@]}"; do
            svc="$(echo "$raw" | xargs)"   # trim whitespace
            [ -z "$svc" ] && continue
            echo "::group::railway up --service '$svc'"
            if railway up --service "$svc" --ci; then
              echo "OK: '$svc' deployed (latest main)"
            else
              echo "::error::deploy failed for '$svc' — check the exact name in the 'List services' step above."
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more services failed to deploy."
            exit 1
          fi
          echo "All requested services deployed from latest main."
