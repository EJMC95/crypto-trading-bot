name: Railway Redeploy

# Auto-deploy LATEST main to the Railway services whose Railway-side Auto Deploy
# is OFF (freqtrade-bots, pnl-dashboard) — but ONLY when files that actually
# affect that service change. Rapid unrelated commits (other bots, workflow
# tweaks, docs) previously redeployed freqtrade-bots on every push and WIPED its
# dry-run paper-trade DB before trades could close. Path filters stop that.
#
# `railway up` builds a fresh deployment from source (railway redeploy only re-runs
# the old one). Toggling Railway's own Auto Deploy is a dashboard-only setting, so
# this workflow is the auto-deploy mechanism.
#
# NOTE: the perps services (perps-bot, momo-bot) use Railway's native GitHub
# auto-deploy and are not controlled here.

on:
  push:
    branches: [main]
    paths:
      # freqtrade-bots service
      - 'user_data/**'
      - 'Dockerfile.freqtrade'
      - 'run_all.sh'
      # pnl-dashboard service
      - 'pnl_dashboard.py'
      - 'report_emailer.py'
      - 'fleet_watchdog_svc.py'
      - 'compile_market_data.py'
      - 'Dockerfile.dashboard'
      # funding-carry service
      - 'funding_carry_bot.py'
      - 'Dockerfile.funding'
      # [2026-07-30] in this image since the carry book gained levers
      - 'fleet_tuning.py'
      # market-context service
      - 'market_context.py'
      - 'Dockerfile.marketcontext'
      # [2026-07-30 SHADOW BOTS GET A DEPLOY ROUTE] Until now these five
      # services had NO auto-deploy rule at all — every change to them shipped
      # only when a human remembered `railway up`. That is the "code was right
      # and was never running" class this repo has documented repeatedly, and
      # it silently applied to the (fz) offense pass: the levers, the widened
      # universes and Snap Back's adaptive gate would all have sat in main,
      # green, and never reached a container.
      # [2026-08-05] tide-rider (retired 1-Aug (if)) and snap-back (retired
      # 4-Aug (jh)) deploy rules REMOVED — operator-queue item 3: the rules
      # must go BEFORE the services are deleted, or auto-deploy resurrects
      # them on the next shared-file push. Their images are declared in
      # audit_deploy_coverage.MANUAL_IMAGES_OK (no route for an idler).
      - 'lighter_funding_spread_bot.py'
      - 'Dockerfile.fundspread'
      - 'lighter_index_bot.py'
      - 'Dockerfile.indexshadow'
      - 'lighter_perp_sniper.py'
      - 'Dockerfile.psniper'
      - 'lighter_family_bot.py'
      - 'Dockerfile.familyshadow'
      # [2026-08-05] 🎸 Barnesy — the funding super-book (band-barnes-shadow).
      # Routed the day it was born, per the (jb) census guard: a new image
      # with no deploy story fails audit_deploy_coverage outright now, which
      # is exactly the birth defect the (fz) shadow books had.
      - 'lighter_band_barnes_bot.py'
      - 'Dockerfile.bandbarnes'
      # [2026-07-30 (gm)] THIS WORKFLOW IS ITS OWN TRIGGER, for the six shadow
      # books only — plus the CARRY PAIR since (hu), same reasoning: its
      # routing was just corrected and a routing fix that cannot deploy itself
      # leaves the correction sitting in main. BOTH lists bind: the
      # decide grep picks the service, but `paths:` decides whether the job runs
      # at all — and without this line a routing fix would still deploy nothing,
      # which is the exact failure (gl) hit. Adding it here means a workflow edit
      # RUNS the job; the decide step then selects only the six.
      - '.github/workflows/railway-redeploy.yml'
      # shared (freqtrade poller + dashboard + regime supervisor)
      - 'bot_pnl_store.py'
      - 'freqtrade_pnl_poller.py'
      - 'market_pulse.py'
      # cross-bot layer (runs inside freqtrade-bots via run_all.sh) — added
      # 2026-07-07 after 9cedf08 (SUI + historize) silently didn't deploy
      - 'regime_oracle.py'
      - 'fleet_risk.py'
      # ---------------------------------------------------------------------
      # The CROSS-BOT LAYER — every module run_all.sh runs inside
      # freqtrade-bots. Added 2026-07-07 for regime_oracle + fleet_risk after
      # 9cedf08 silently didn't deploy; the other 15 were never added as they
      # shipped, so the ENTIRE autonomy + evidence layer had no deploy path for
      # 10 days — a fix that merges, goes green and never reaches the container
      # is indistinguishable from one that worked. Measured 17-Jul: 15 of 19
      # organs absent. `scripts/audit_deploy_coverage.py` derives each service's
      # real file set from its Dockerfile and FAILS when this drifts — run it
      # instead of remembering. Keep in sync with the grep below: two
      # lists gate one deploy, and being in one but not the other deploys
      # nothing while looking green.
      - 'bot_learn.py'
      - 'brain_stats.py'
      - 'evidence_board.py'
      - 'fleet_immune.py'
      - 'fleet_regen.py'
      - 'fleet_proprioception.py'
      - 'fleet_respiration.py'
      - 'fleet_clock.py'
      - 'fleet_bus.py'
      - 'fleet_tuning.py'
      - 'fleet_proposals.py'
      # 📡 edge radar — COPY'd into Dockerfile.freqtrade + looped in run_all.sh
      # (`--publish`, 30-min). Added 2026-07-23: it shipped in the image via
      # (cl)/(cm)/(cn) but was absent from BOTH lists here, so it was
      # deploy-orphaned — a silent no-op that audit_deploy_coverage.py caught.
      - 'fleet_radar.py'
      - 'fleet_allocation.py'
      # 🚦 go-live grader — COPY'd into Dockerfile.freqtrade + looped in
      # run_all.sh (`--publish`, 6-hourly) as of 2026-07-30. It is the ONLY
      # file under `scripts/` that ships in an image, which is exactly why it
      # needs an explicit entry here and in the service grep below.
      - 'scripts/golive_readiness.py'
      - 'experiment_judge.py'
      - 'strategy_incubator.py'
      - 'implementation_shortfall.py'
      - 'event_sentinel.py'
      - 'lighter_market_scout.py'
      - 'lighter_ticket_taker.py'
      - 'lighter_scout_tuner.py'
      - 'lighter_ticket_replay.py'
      - 'cleanup_legacy_bots.py'
      - 'funding_basis.py'
      - 'dashboard_server.py'
      - 'paper_broker.py'
      - 'venues/**'
      # [2026-07-25] LIVE-BOT MARKER-PATH TRIGGER. lighter_funding_bot.py is the
      # live Farmer's OWN code (service trail-blazer-live, Dockerfile.fundinglighter
      # — NOT a freqtrade-bots file). It is listed here ONLY so a funding push RUNS
      # this workflow, where the decide step's [deploy-live-farmer]/[deploy-live]
      # marker gate decides whether to deploy the real-money Farmer. No marker ->
      # the job runs and deploys NOTHING (svcs stays empty; the deploy step is
      # skipped). lighter_ticket_taker.py + venues/** above already trigger it for
      # the taker's own marker path. BOTH lists bind (audit_deploy_coverage.py):
      # paths gates whether the job runs, the decide grep picks the service.
      - 'lighter_funding_bot.py'
      # [2026-07-29 AUDIT] the live images' FULL COPY sets — the paths: half.
      # #100 widened the DECIDE greps (taker_files/farmer_files) to cover
      # every file baked into the live images, but left these four off THIS
      # list — and paths: gates whether the job runs AT ALL, so a marker
      # push touching only e.g. tickettaker_loop.sh (the live Taker's
      # restart/backoff wrapper) fired no workflow and deployed nothing,
      # silently: the exact both-lists class the comment above warns about,
      # reintroduced by the fix that widened one list. requirements.txt
      # carries the real-money signer pin (lighter-sdk) COPY'd into every
      # live/funding/market-context image. audit_deploy_coverage now
      # cross-checks the marker greps against this list.
      - 'tickettaker_loop.sh'
      - 'Dockerfile.tickettaker'
      - 'Dockerfile.fundinglighter'
      - 'requirements.txt'
      # [2026-07-21] 🏛️ the Parliament (runs inside freqtrade-bots via
      # run_all.sh). Added the same day it shipped — the 17-Jul lesson: a
      # module COPY'd into the image but absent from THIS list merges green
      # and never reaches the container (#74's scanner-bench telemetry was
      # the first casualty: parliament/*.py-only change, no deploy trigger).
      - 'parliament_main.py'
      - 'parliament/**'
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated Railway service names (blank defaults to both)."
        required: false
        default: "freqtrade-bots,pnl-dashboard"

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history: push events diff the whole before..after range

      - name: Decide which services to deploy
        id: decide
        env:
          DISPATCH_SVCS: ${{ github.event.inputs.services }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch can still deploy freqtrade-bots ON PURPOSE (e.g. when
            # we intentionally ship a strategy change and accept one paper-DB reset).
            svcs="${DISPATCH_SVCS:-freqtrade-bots,pnl-dashboard}"
          else
            # Diff the WHOLE push (before..after), not just the last commit —
            # a multi-commit push ending in a docs commit was deploying nothing.
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$before HEAD"
            else
              range="HEAD^ HEAD"   # fallback: first push to branch / force push
            fi
            changed="$(git diff --name-only $range 2>/dev/null || echo '')"
            echo "Changed files:"; echo "$changed"
            svcs=""
            # [2026-07-03 UNFROZEN] freqtrade-bots auto-deploy is back on: the
            # service now has a Railway volume at /freqtrade/persist and every
            # bot's db_url points into it, so redeploys/restarts no longer wipe
            # the dry-run paper DBs (the reason for the 2026-07-01 freeze).
            # Keep in sync with the `paths:` filter above — both gate the same
            # deploy. scripts/audit_deploy_coverage.py enforces both against the Dockerfiles.
            if echo "$changed" | grep -qE '^(user_data/|venues/|parliament/|parliament_main\.py$|Dockerfile\.freqtrade$|run_all\.sh$|bot_pnl_store\.py$|market_pulse\.py$|freqtrade_pnl_poller\.py$|regime_oracle\.py$|fleet_risk\.py$|bot_learn\.py$|brain_stats\.py$|evidence_board\.py$|fleet_immune\.py$|fleet_regen\.py$|fleet_proprioception\.py$|fleet_respiration\.py$|fleet_clock\.py$|fleet_bus\.py$|fleet_tuning\.py$|fleet_proposals\.py$|fleet_radar\.py$|fleet_allocation\.py$|scripts/golive_readiness\.py$|experiment_judge\.py$|strategy_incubator\.py$|implementation_shortfall\.py$|event_sentinel\.py$|lighter_market_scout\.py$|lighter_ticket_taker\.py$|lighter_scout_tuner\.py$|lighter_ticket_replay\.py$|cleanup_legacy_bots\.py$|funding_basis\.py$|dashboard_server\.py$|paper_broker\.py$)'; then
              svcs="freqtrade-bots"
            fi
            if echo "$changed" | grep -qE '^(pnl_dashboard\.py$|report_emailer\.py$|compile_market_data\.py$|bot_pnl_store\.py$|Dockerfile\.dashboard$|fleet_watchdog_svc\.py$)'; then
              svcs="${svcs:+$svcs,}pnl-dashboard"
            fi
            # [2026-07-16] perps-regime-switch REMOVED: the service was
            # decommissioned in the 12/13-Jul retirement (RETIRED_ROWS), so
            # `railway up` returned "Service not found" x3 on every
            # bot_pnl_store.py change — two red runs + failure emails on
            # 16-Jul while every LIVING service deployed fine.
            # funding-carry service
            # [2026-07-30] fleet_tuning.py joined this image's COPY set when
            # the carry book gained growth-rail levers. It must be in BOTH this
            # grep and the `paths:` block above, or editing the lever registry
            # would be a silent no-op for funding-carry — caught by
            # audit_deploy_coverage.py before it shipped, which is the whole
            # point of that guard.
            # [2026-07-30 (gn) REVERTED — "deploy both" was WRONG, and the
            # reason I gave for it was the wrong reason.]
            # (gl) added `yield-harvester-shadow` beside `funding-carry` on the
            # operator's call, on my argument that "neither carries a volume, so
            # a redundant redeploy costs nothing". The volume was never the risk.
            # BOTH SERVICES PUBLISH THE SAME `bot_pnl` ROW
            # (`perps-funding-carry-lshadow`), so they are not redundant — they
            # are two writers of one key, and the row becomes whoever published
            # last. MEASURED within minutes of the catch-up dispatch: the row
            # flipped from n=82 with `extra.caps` present to **n=71 with
            # caps=None** and no build stamp, i.e. a publisher running code that
            # predates (gd) stomped the good one. `funding_carry_bot.py` emits
            # `caps` unconditionally every loop, so caps=None is proof the
            # winning writer is not running HEAD.
            # WHAT IS *NOT* DAMAGED, checked rather than assumed: the paper
            # LEDGER is clean — 82 closes for this row, ZERO duplicate
            # trade_ids. The go-live grader and the 30-day baseline read that
            # ledger, so the EVIDENCE is intact; the casualty is the summary
            # row (and `extra.caps`, which the evidence board reads to detect
            # saturation).
            # A deploy rule cannot fix this: both services are running
            # regardless of what this workflow does, so one of them must be
            # STOPPED in Railway — an operator action. Reverting here at least
            # stops this repo from re-waking the duplicate on every push.
            # [2026-07-31 (hu)] `yield-harvester-shadow` RE-ADDED, and this
            # time on MEASUREMENT rather than on the argument (gn) rightly
            # rejected. Read the (gn) paragraph above first — it is still
            # correct about why (gl)'s reasoning was wrong.
            #
            # WHAT CHANGED. (ht) shipped `extra.svc` on every publish, so for
            # the first time this repo can SEE which service writes a row.
            # Measured minutes after the (ht) deploy, run 30598053371, which
            # reported `OK: 'funding-carry' deployed`:
            #   * SEVEN deployed services stamped themselves correctly
            #     (counterweight-shadow, equities-regime-shadow,
            #     family-lighter-shadow, freqtrade-bots, perp-sniper-shadow,
            #     snap-back-shadow, tide-rider-lighter-shadow) — so the
            #     mechanism works and its absence is signal, not noise.
            #   * `funding-carry` published NOTHING, on any row.
            #   * `perps-funding-carry-lshadow` kept publishing every ~90-170s
            #     on build `fbb926402049` with NO svc — i.e. pre-(hp) code, on
            #     a container the deploy did not reach. Twenty samples over ten
            #     minutes: one state, never a flip.
            # `yield-harvester-shadow` is the only other carry service, so it
            # is the one running the book — and it is the one with no deploy
            # rule, which is exactly why it still runs code predating both the
            # (hp) sole-writer guard and the (ht) stamp.
            #
            # WHY "TWO WRITERS" NO LONGER BLOCKS THIS. (gn) reverted (gl)
            # because deploying both made two writers of one key. That
            # objection is spent: (hp) put `claim_writer` at the TOP of the
            # carry loop, so if both containers do run, the second STANDS DOWN
            # instead of pooling the ledger. Deploying the un-guarded service
            # is now the only way to GIVE it that guard — leaving it out is
            # what keeps the duplicate possible.
            #
            # NOT A GUESS about which service to keep: both are deployed, and
            # the guard picks the winner at runtime. That is deliberately the
            # opposite of (gl)'s error, which was naming a service from a
            # dashboard row id. Stopping the loser stays an OPERATOR act.
            # [2026-08-05 (jr) S1] fleet_bus.py joined this image's COPY set
            # (the allocation-scale consumer) — in BOTH this grep and paths:,
            # or editing the bus would be a silent no-op for funding-carry
            # (the exact fleet_tuning precedent five lines up).
            if echo "$changed" | grep -qE '^(funding_carry_bot\.py$|Dockerfile\.funding$|bot_pnl_store\.py$|funding_basis\.py$|paper_broker\.py$|fleet_tuning\.py$|fleet_bus\.py$|venues/|requirements\.txt$|\.github/workflows/railway-redeploy\.yml$)'; then
              # TWO SEPARATE ASSIGNMENTS, deliberately — NOT
              # `...}funding-carry,yield-harvester-shadow`. audit_deploy_coverage
              # associates a grep with a service by matching the
              # `svcs="${svcs:+$svcs,}<name>"` shape one name at a time, so the
              # comma-joined form made it read the pair as a single unknown
              # service and report Dockerfile.funding's five files (plus
              # market-context's two) as DEPLOY-ORPHANED. The guard caught this
              # before it shipped, which is the same service it did in (gl) —
              # and the same parser limitation (gl) recorded. Keep one name per
              # line so the guard can keep seeing.
              svcs="${svcs:+$svcs,}funding-carry"
              svcs="${svcs:+$svcs,}yield-harvester-shadow"
            fi
            # market-context service (🛰️ instrument collector). Its live-bot
            # freshness watchdog is the fleet's ONLY cross-region check on the
            # real-money books — it runs in a different service from the bots on
            # purpose, so a region outage that silences them cannot silence it.
            # A change here that does not deploy is a blind spot on real money.
            # [2026-07-17] This service had NO deploy rule at all; market_context.py
            # had only ever shipped via a manual `railway up`.
            if echo "$changed" | grep -qE '^(market_context\.py$|Dockerfile\.marketcontext$|bot_pnl_store\.py$|funding_basis\.py$|venues/|cleanup_legacy_bots\.py$|requirements\.txt$)'; then
              svcs="${svcs:+$svcs,}market-context"
            fi
            # [2026-07-30] THE SHADOW BOOKS. Each ships its own image, and each
            # also carries the shared money/organ modules, so a change to
            # bot_pnl_store, paper_broker, venues/, fleet_tuning or fleet_bus
            # must redeploy them too — that is what the (fz) pass proved: it
            # added fleet_tuning/fleet_bus to five of these images, and without
            # this block the very levers it registered could never reach them.
            # Names are RESOLVED against the live Railway service list below,
            # so a name that does not exist warns instead of red-failing the
            # build (the "Service not found x3" failure mode noted above).
            #
            # [2026-07-30 (gl) NAMES NOW VERIFIED — four of these six were
            # WRONG.] (fz) shipped this block with the names GUESSED from the
            # dashboard row ids, and the resolver did its job: run 30492918936
            # deployed equities-regime-shadow + family-lighter-shadow and
            # warned UNRESOLVED on the other four, so those books never
            # received the levers (fz) registered for them. Railway's names
            # follow the EMOJI NICKNAME, not the row id, which is why the
            # guesses failed in one direction:
            #   lighter-dislocation      -> snap-back-shadow            🧲
            #   perps-funding-spread     -> counterweight-shadow        ⚖️
            #   lighter-perp-sniper      -> perp-sniper-shadow          🎯
            #   crypto-trend-daily-shadow-> tide-rider-lighter-shadow   🌊
            # Read off `railway service list` (run 30494145090, dispatched
            # with a deliberately bogus service so it enumerated and deployed
            # nothing). audit_deploy_coverage.py now carries the same six in
            # AUTO_IMAGES, so a future rename is caught by the guard rather
            # than by a warning nobody reads.
            #
            # STILL UNVERIFIED, and NOT guessed here: the project also has a
            # `yield-harvester-shadow` service alongside `funding-carry`, and
            # this repo cannot tell which of the two publishes the
            # perps-funding-carry-lshadow row. Both run carry code, so the
            # funding-carry rule above may be deploying the wrong one. Left
            # for the operator rather than resolved by guessing — the guess is
            # what cost four books their shot.
            # [2026-07-30 (gm) A ROUTING FIX CANNOT DEPLOY ITSELF — measured.]
            # (gl) corrected four wrong service names and merged as `ed5cce0`.
            # That commit touched the workflow, the changelog, the dashboard and
            # some tests — and NOT ONE of the six books' own files. So every
            # corrected rule stayed silent and the run reported
            # `Deployed: freqtrade-bots,pnl-dashboard`. The names were right and
            # the books STILL had not received (fz)'s levers, two merges later.
            # Fixing the route does not retroactively travel it.
            # THE FIX: this workflow file is itself part of each shadow book's
            # trigger set, so a change to the routing redeploys the services it
            # routes to. Scoped to these six ON PURPOSE — they are $1k SHADOW
            # books with no volumes and nothing to lose to a redeploy, and they
            # are exactly the ones whose names were unverified. The live bots and
            # freqtrade-bots are NOT included: the live pair must stay
            # marker-gated (an unmarked WIP push must never ship real money), and
            # freqtrade-bots should not rebuild on every workflow tweak.
            # Kept as ONE single-quoted literal rather than composed from a
            # second variable. The composed form needed double quotes to
            # interpolate, and inside double quotes every `$` anchor has to be
            # written `\$` — which is a LITERAL dollar in the regex, not an
            # end-anchor, silently turning `bot_pnl_store\.py$` into a pattern
            # that matches nothing. audit_deploy_coverage refused the composed
            # version outright (unresolved interpolation), which is the guard
            # from (gl) earning its keep an hour later on its own author.
            _shared='bot_pnl_store\.py$|paper_broker\.py$|fleet_tuning\.py$|fleet_bus\.py$|funding_basis\.py$|venues/|requirements\.txt$|\.github/workflows/railway-redeploy\.yml$'
            # [2026-08-05] snap-back-shadow + tide-rider-lighter-shadow rules
            # REMOVED (retired (jh)/(if)) — a $_shared push must not resurrect
            # a service the operator is about to delete.
            if echo "$changed" | grep -qE "^(lighter_funding_spread_bot\.py$|Dockerfile\.fundspread$|$_shared)"; then
              svcs="${svcs:+$svcs,}counterweight-shadow"
            fi
            if echo "$changed" | grep -qE "^(lighter_index_bot\.py$|Dockerfile\.indexshadow$|$_shared)"; then
              svcs="${svcs:+$svcs,}equities-regime-shadow"
            fi
            if echo "$changed" | grep -qE "^(lighter_perp_sniper\.py$|Dockerfile\.psniper$|$_shared)"; then
              svcs="${svcs:+$svcs,}perp-sniper-shadow"
            fi
            if echo "$changed" | grep -qE "^(lighter_family_bot\.py$|Dockerfile\.familyshadow$|$_shared)"; then
              svcs="${svcs:+$svcs,}family-lighter-shadow"
            fi
            # [2026-08-05] 🎸 Barnesy (band-barnes-shadow) — the funding
            # super-book. Same $_shared contract as the other shadow books:
            # its image COPYs the shared money/organ modules, so a change to
            # any of them must redeploy this container too. Service name is
            # created alongside this rule (railway add --service
            # band-barnes-shadow); the resolver step ERRORS on a name that
            # does not resolve, per the (hj) no-warning rule.
            if echo "$changed" | grep -qE "^(lighter_band_barnes_bot\.py$|Dockerfile\.bandbarnes$|$_shared)"; then
              svcs="${svcs:+$svcs,}band-barnes-shadow"
            fi
            # [2026-07-24 taker; 2026-07-25 Farmer] OPT-IN LIVE-BOT auto-deploy.
            # The two REAL-MONEY services (tide-rider-lighter-live = 🎫 Ticket Taker,
            # trail-blazer-live = 💸 Funding Farmer — service names lie) are
            # DELIBERATELY off the blanket auto-path: an unmarked WIP/held push must
            # never auto-restart a real-money book. That barrier stopped the (ff)
            # rail fix from surprise-deploying before the operator said "go ahead",
            # and for the FARMER it guards a MEASURED restart hazard — its slope gate
            # fails open ~1h after boot, and a restart once wiped a memory-only halt
            # and re-bought HYPE 37s later (lighter-flatten-silent-halt-redeploy-
            # incident). Phase 2 fixes that hazard; until then the marker keeps every
            # Farmer deploy DELIBERATE.
            # This adds CONVENIENCE without removing the barrier: a push that changes
            # a live bot's OWN code (or the shared venues/ surface) AND carries an
            # explicit marker in ANY commit message in the range ALSO deploys that
            # bot from CLEAN main (the checkout above is ref: main), exactly like a
            # manual workflow_dispatch — just triggered by a commit tag:
            #   [deploy-live-taker]  -> tide-rider-lighter-live
            #   [deploy-live-farmer] -> trail-blazer-live
            #   [deploy-live]        -> BOTH, but each still gated on ITS OWN files
            #                           changing (a farmer-only push won't restart the
            #                           taker, and vice-versa).
            # No marker -> only the SHADOW (freqtrade-bots) ships, exactly as before.
            # Restrict-by-construction: no marker, no real-money deploy. Verify the
            # running container's build stamp after (a green run never implied the
            # container took it — [[railway-cli-frozen-services]]).
            # [2026-07-30 (hj)] SUBJECT LINES ONLY — this was `%B` (the full
            # body) and a commit that merely MENTIONED a marker deployed real
            # money. Measured, on this very commit: the body sentence
            # "NOT deployed to the live taker: no [deploy-live-taker] marker"
            # matched the grep and deployed `tide-rider-lighter-live`. The
            # sentence declaring the deploy was not happening is what caused
            # it. A real-money gate must not be triggerable by prose about the
            # gate. Every genuine marker in this repo's history sits in the
            # SUBJECT (2902726, 8a2028f), which is also the documented usage,
            # so this narrows the trigger to actual use and excludes mention.
            msgs="$(git log --format='%s' ${range/ /..} 2>/dev/null)"
            live_all=0
            if printf '%s' "$msgs" | grep -qF '[deploy-live]'; then live_all=1; fi
            # [2026-07-28 AUDIT FIX] each grep now covers its live image's
            # FULL COPY set (Dockerfile.tickettaker / .fundinglighter), not
            # just the entrypoint + venues/: bot_pnl_store, paper_broker,
            # fleet_tuning, funding_basis, the loop script and the
            # Dockerfiles themselves all bake into the live images, and a
            # marker push touching only those files silently deployed
            # NOTHING (measured: 9476811's bot_pnl_store build-stamp — the
            # drift sensor's own feed — could not reach either live arm via
            # its marker).
            taker_files='^(lighter_ticket_taker\.py$|venues/|bot_pnl_store\.py$|paper_broker\.py$|fleet_tuning\.py$|funding_basis\.py$|tickettaker_loop\.sh$|Dockerfile\.tickettaker$|requirements\.txt$)'
            # [2026-08-05 (jr) S1] + fleet_bus.py: now in the farmer image's
            # COPY set (shadow-arm allocation consumer; live arm never reads it)
            farmer_files='^(lighter_funding_bot\.py$|venues/|bot_pnl_store\.py$|paper_broker\.py$|fleet_tuning\.py$|fleet_bus\.py$|funding_basis\.py$|Dockerfile\.fundinglighter$|requirements\.txt$)'
            if echo "$changed" | grep -qE "$taker_files" \
               && { [ "$live_all" = 1 ] || printf '%s' "$msgs" | grep -qF '[deploy-live-taker]'; }; then
              svcs="${svcs:+$svcs,}tide-rider-lighter-live"
              echo "-> live-taker marker: including tide-rider-lighter-live (REAL MONEY)"
            fi
            # [2026-07-30 (hi)] THE EXPERIMENT'S TWO ARMS MUST DEPLOY TOGETHER.
            # `funding-farmer-shadow` — the CONTROL arm of the promotion pipeline
            # — appeared nowhere in this workflow, only in a comment inside
            # experiment_judge.py. So it had NO deploy route: every live-Farmer
            # deploy left the arms on different code, and the judge's own ARM
            # DRIFT gate then refuses every promotion ("this window measures a
            # code delta, not edge"). MEASURED after (hb) went out this morning:
            # live 705425a83422 vs shadow 128995c2fd76 — drifted, by my own
            # deploy. The judge happened to be idle, so nothing was blocked; the
            # next candidate would have been drift-held on arrival.
            # GATED ON THE SAME MARKER AND THE SAME FILE SET as the live arm, on
            # purpose: matched-in-both-directions is the property that matters,
            # and auto-deploying the shadow on every unmarked push would simply
            # drift the arms the other way. The service SPLIT stays (the control
            # container holds zero keys and no REAL_MONEY_KILL — a hard boundary
            # the judge's comment says must not become a soft one); only the
            # deploy CLOCK is joined.
            # `audit_deploy_coverage.py --arms` enforces the pairing.
            if echo "$changed" | grep -qE "$farmer_files" \
               && { [ "$live_all" = 1 ] || printf '%s' "$msgs" | grep -qF '[deploy-live-farmer]'; }; then
              svcs="${svcs:+$svcs,}trail-blazer-live,funding-farmer-shadow"
              echo "-> live-farmer marker: including trail-blazer-live (REAL MONEY)"
              echo "-> ...and funding-farmer-shadow, its CONTROL arm (arm-drift)"
            fi
          fi
          echo "services=$svcs" >> "$GITHUB_OUTPUT"
          echo "-> will deploy: ${svcs:-<none>}"

      - name: Install Railway CLI
        if: steps.decide.outputs.services != ''
        run: npm install -g @railway/cli

      - name: Deploy latest code to services
        if: steps.decide.outputs.services != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICES: ${{ steps.decide.outputs.services }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set (Settings > Secrets and variables > Actions, use a Railway PROJECT token)."
            exit 1
          fi
          fail=0
          # [2026-07-30 NAME RESOLUTION] Print the project's REAL service list
          # once, and use it to classify each target. Six shadow-bot services
          # gained deploy rules in this pass and their exact Railway names
          # could not be verified from the repo — the only names recorded
          # anywhere were funding-carry, pnl-dashboard, market-context and the
          # two live bots. Hardcoding a guess would red-fail the build on
          # "Service not found" (see the retry loop below), so instead: a
          # target that does NOT appear in the live list is reported loudly as
          # UNRESOLVED and skipped, while the resolvable ones still deploy.
          # The printed list is how the next session fixes any name in one
          # pass, with real data instead of another guess.
          known=""
          if known="$(railway service list 2>/dev/null || railway status --json 2>/dev/null)"; then
            echo "::group::Railway services visible to this token"
            echo "$known"
            echo "::endgroup::"
          else
            echo "note: could not enumerate services; every target will be attempted."
            known=""
          fi
          unresolved=""
          IFS=',' read -ra SVCS <<< "$SERVICES"
          for raw in "${SVCS[@]}"; do
            svc="$(echo "$raw" | xargs)"
            [ -z "$svc" ] && continue
            if [ -n "$known" ] && ! echo "$known" | grep -qiF "$svc"; then
              # [2026-07-30 (hj)] This was a ::warning:: and a skip. On
              # 2026-07-30 run 30492918936 it warned for FOUR of the six
              # Farnham Six services, the build went green, and the levers
              # built for those books reached no container for a full day.
              # A green build carrying a warning is indistinguishable from a
              # green build. The names are no longer guesses — (gl) read every
              # one off `railway service list` — so an unresolvable name now
              # means a RENAME or a typo, and both must stop the run.
              echo "::error::service '$svc' is NOT in this project's service list."
              echo "  A deploy rule exists for it, but the name does not resolve, so"
              echo "  NOTHING was deployed for it. Fix the name in"
              echo "  .github/workflows/railway-redeploy.yml against the list above"
              echo "  (and scripts/audit_deploy_coverage.py, which pins the same names)."
              unresolved="${unresolved:+$unresolved,}$svc"
              fail=1
              continue
            fi
            echo "::group::railway up --service '$svc'"
            ok=0
            for attempt in 1 2 3; do
              if railway up --service "$svc" --ci; then ok=1; break; fi
              echo "attempt $attempt for '$svc' failed (transient Railway API error); retrying in $((attempt*15))s..."
              sleep $((attempt*15))
            done
            if [ "$ok" -eq 1 ]; then
              echo "OK: '$svc' deployed (latest main)"
            else
              echo "::error::deploy failed for '$svc' after 3 attempts — transient API error or wrong service name."
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ -n "$unresolved" ]; then
            echo "::error::UNRESOLVED service names (no deploy happened for these): $unresolved"
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more services failed to deploy."
            exit 1
          fi
          echo "Deployed: $SERVICES"
