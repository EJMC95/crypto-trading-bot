name: Railway Redeploy

# Auto-deploy LATEST main to the Railway services whose Railway-side Auto Deploy
# is OFF (freqtrade-bots, pnl-dashboard) — but ONLY when files that actually
# affect that service change. Rapid unrelated commits (other bots, workflow
# tweaks, docs) previously redeployed freqtrade-bots on every push and WIPED its
# dry-run paper-trade DB before trades could close. Path filters stop that.
#
# `railway up` builds a fresh deployment from source (railway redeploy only re-runs
# the old one). Toggling Railway's own Auto Deploy is a dashboard-only setting, so
# this workflow is the auto-deploy mechanism.
#
# NOTE: the perps services (perps-bot, momo-bot) use Railway's native GitHub
# auto-deploy and are not controlled here.

on:
  push:
    branches: [main]
    paths:
      # freqtrade-bots service
      - 'user_data/**'
      - 'Dockerfile.freqtrade'
      - 'run_all.sh'
      # pnl-dashboard service
      - 'pnl_dashboard.py'
      - 'report_emailer.py'
      - 'fleet_watchdog_svc.py'
      - 'compile_market_data.py'
      - 'Dockerfile.dashboard'
      # funding-carry service
      - 'funding_carry_bot.py'
      - 'Dockerfile.funding'
      # market-context service
      - 'market_context.py'
      - 'Dockerfile.marketcontext'
      # shared (freqtrade poller + dashboard + regime supervisor)
      - 'bot_pnl_store.py'
      - 'freqtrade_pnl_poller.py'
      - 'market_pulse.py'
      # cross-bot layer (runs inside freqtrade-bots via run_all.sh) — added
      # 2026-07-07 after 9cedf08 (SUI + historize) silently didn't deploy
      - 'regime_oracle.py'
      - 'fleet_risk.py'
      # ---------------------------------------------------------------------
      # The CROSS-BOT LAYER — every module run_all.sh runs inside
      # freqtrade-bots. Added 2026-07-07 for regime_oracle + fleet_risk after
      # 9cedf08 silently didn't deploy; the other 15 were never added as they
      # shipped, so the ENTIRE autonomy + evidence layer had no deploy path for
      # 10 days — a fix that merges, goes green and never reaches the container
      # is indistinguishable from one that worked. Measured 17-Jul: 15 of 19
      # organs absent. `scripts/audit_deploy_coverage.py` derives each service's
      # real file set from its Dockerfile and FAILS when this drifts — run it
      # instead of remembering. Keep in sync with the grep below: two
      # lists gate one deploy, and being in one but not the other deploys
      # nothing while looking green.
      - 'bot_learn.py'
      - 'brain_stats.py'
      - 'evidence_board.py'
      - 'fleet_immune.py'
      - 'fleet_regen.py'
      - 'fleet_proprioception.py'
      - 'fleet_respiration.py'
      - 'fleet_clock.py'
      - 'fleet_bus.py'
      - 'fleet_tuning.py'
      - 'experiment_judge.py'
      - 'strategy_incubator.py'
      - 'implementation_shortfall.py'
      - 'event_sentinel.py'
      - 'lighter_market_scout.py'
      - 'lighter_ticket_taker.py'
      - 'lighter_scout_tuner.py'
      - 'lighter_ticket_replay.py'
      - 'cleanup_legacy_bots.py'
      - 'funding_basis.py'
      - 'dashboard_server.py'
      - 'paper_broker.py'
      - 'venues/**'
      # [2026-07-21] 🏛️ the Parliament (runs inside freqtrade-bots via
      # run_all.sh). Added the same day it shipped — the 17-Jul lesson: a
      # module COPY'd into the image but absent from THIS list merges green
      # and never reaches the container (#74's scanner-bench telemetry was
      # the first casualty: parliament/*.py-only change, no deploy trigger).
      - 'parliament_main.py'
      - 'parliament/**'
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated Railway service names (blank defaults to both)."
        required: false
        default: "freqtrade-bots,pnl-dashboard"

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history: push events diff the whole before..after range

      - name: Decide which services to deploy
        id: decide
        env:
          DISPATCH_SVCS: ${{ github.event.inputs.services }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch can still deploy freqtrade-bots ON PURPOSE (e.g. when
            # we intentionally ship a strategy change and accept one paper-DB reset).
            svcs="${DISPATCH_SVCS:-freqtrade-bots,pnl-dashboard}"
          else
            # Diff the WHOLE push (before..after), not just the last commit —
            # a multi-commit push ending in a docs commit was deploying nothing.
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$before HEAD"
            else
              range="HEAD^ HEAD"   # fallback: first push to branch / force push
            fi
            changed="$(git diff --name-only $range 2>/dev/null || echo '')"
            echo "Changed files:"; echo "$changed"
            svcs=""
            # [2026-07-03 UNFROZEN] freqtrade-bots auto-deploy is back on: the
            # service now has a Railway volume at /freqtrade/persist and every
            # bot's db_url points into it, so redeploys/restarts no longer wipe
            # the dry-run paper DBs (the reason for the 2026-07-01 freeze).
            # Keep in sync with the `paths:` filter above — both gate the same
            # deploy. scripts/audit_deploy_coverage.py enforces both against the Dockerfiles.
            if echo "$changed" | grep -qE '^(user_data/|venues/|parliament/|parliament_main\.py$|Dockerfile\.freqtrade$|run_all\.sh$|bot_pnl_store\.py$|market_pulse\.py$|freqtrade_pnl_poller\.py$|regime_oracle\.py$|fleet_risk\.py$|bot_learn\.py$|brain_stats\.py$|evidence_board\.py$|fleet_immune\.py$|fleet_regen\.py$|fleet_proprioception\.py$|fleet_respiration\.py$|fleet_clock\.py$|fleet_bus\.py$|fleet_tuning\.py$|experiment_judge\.py$|strategy_incubator\.py$|implementation_shortfall\.py$|event_sentinel\.py$|lighter_market_scout\.py$|lighter_ticket_taker\.py$|lighter_scout_tuner\.py$|lighter_ticket_replay\.py$|cleanup_legacy_bots\.py$|funding_basis\.py$|dashboard_server\.py$|paper_broker\.py$)'; then
              svcs="freqtrade-bots"
            fi
            if echo "$changed" | grep -qE '^(pnl_dashboard\.py$|report_emailer\.py$|compile_market_data\.py$|bot_pnl_store\.py$|Dockerfile\.dashboard$|fleet_watchdog_svc\.py$)'; then
              svcs="${svcs:+$svcs,}pnl-dashboard"
            fi
            # [2026-07-16] perps-regime-switch REMOVED: the service was
            # decommissioned in the 12/13-Jul retirement (RETIRED_ROWS), so
            # `railway up` returned "Service not found" x3 on every
            # bot_pnl_store.py change — two red runs + failure emails on
            # 16-Jul while every LIVING service deployed fine.
            # funding-carry service
            if echo "$changed" | grep -qE '^(funding_carry_bot\.py$|Dockerfile\.funding$|bot_pnl_store\.py$|funding_basis\.py$|paper_broker\.py$|venues/)'; then
              svcs="${svcs:+$svcs,}funding-carry"
            fi
            # market-context service (🛰️ instrument collector). Its live-bot
            # freshness watchdog is the fleet's ONLY cross-region check on the
            # real-money books — it runs in a different service from the bots on
            # purpose, so a region outage that silences them cannot silence it.
            # A change here that does not deploy is a blind spot on real money.
            # [2026-07-17] This service had NO deploy rule at all; market_context.py
            # had only ever shipped via a manual `railway up`.
            if echo "$changed" | grep -qE '^(market_context\.py$|Dockerfile\.marketcontext$|bot_pnl_store\.py$|funding_basis\.py$|venues/|cleanup_legacy_bots\.py$)'; then
              svcs="${svcs:+$svcs,}market-context"
            fi
          fi
          echo "services=$svcs" >> "$GITHUB_OUTPUT"
          echo "-> will deploy: ${svcs:-<none>}"

      - name: Install Railway CLI
        if: steps.decide.outputs.services != ''
        run: npm install -g @railway/cli

      - name: Deploy latest code to services
        if: steps.decide.outputs.services != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICES: ${{ steps.decide.outputs.services }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set (Settings > Secrets and variables > Actions, use a Railway PROJECT token)."
            exit 1
          fi
          fail=0
          IFS=',' read -ra SVCS <<< "$SERVICES"
          for raw in "${SVCS[@]}"; do
            svc="$(echo "$raw" | xargs)"
            [ -z "$svc" ] && continue
            echo "::group::railway up --service '$svc'"
            ok=0
            for attempt in 1 2 3; do
              if railway up --service "$svc" --ci; then ok=1; break; fi
              echo "attempt $attempt for '$svc' failed (transient Railway API error); retrying in $((attempt*15))s..."
              sleep $((attempt*15))
            done
            if [ "$ok" -eq 1 ]; then
              echo "OK: '$svc' deployed (latest main)"
            else
              echo "::error::deploy failed for '$svc' after 3 attempts — transient API error or wrong service name."
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more services failed to deploy."
            exit 1
          fi
          echo "Deployed: $SERVICES"
