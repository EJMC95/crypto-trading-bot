name: fleet-weekly-assessment

# Replaces the vanished Cowork task trig_01NiRF77c8Se18jhHfZBPhvT (3rd silent
# disappearance). Deterministic scoreboard at $0; Claude writes only the
# verdict, on request. Eamon chose rebuild-in-Actions on 28-Jul-2026.
# Sun 23:30 UTC = Mon 09:30 AEST (winter; 10:30 AEDT in summer — acceptable).

on:
  schedule:
    - cron: '30 23 * * 0'
  workflow_dispatch:

# [2026-08-17 (pn)] `actions: read` is LOAD-BEARING, not tidiness. Declaring a
# `permissions:` block zeroes every scope not listed, so until this line existed
# the `audit_ci_coverage` step below could not run `gh run list` at all: it read
# the history as unreadable, returned its UNKNOWN verdict and exited 2 by design
# ((mq): a guard with no answer must not print OK). Measured on run 31979750293,
# the guard's FIRST scheduled run after `(pc)` shipped it — red, and structurally
# incapable of ever being anything else. `tests.yml:43` already carried a comment
# recording this exact missing scope; the trap was written down in one workflow
# and walked into in another. Pinned by test_code_currency_wired.py.
permissions:
  contents: read
  issues: write
  actions: read

env:
  FEED: https://pnl-dashboard-production-858c.up.railway.app/pnl.json
  # `?hours=0` = live keys with no history array (262 KB vs 8.6 MB).
  BUS: https://pnl-dashboard-production-858c.up.railway.app/bus.json?hours=0
  # [2026-08-17 (pp)] EXPOSURE_BUDGET is GONE, not merely unused. It was a
  # hardcoded '20' duplicating `fleet_risk.long_budget` — which is itself a
  # LEVER (`risk.long_budget`, movable by the growth rail), so the copy could
  # drift from the enforced value with nothing to catch it. The scoreboard now
  # reads the enforcer's own budget alongside its own count.

jobs:
  # [2026-08-04 (jc)] CODE CURRENCY — `(iw)` built the tool and it had ZERO
  # consumers: deploy-verification labor was ~29% of the week's changelog
  # entries while the command that ends that class ran only when a human
  # remembered it (the exact "rule nobody runs" shape (gk) fixed for the
  # go-live grader). A SEPARATE job, deliberately: a BEHIND-OWN red must fail
  # the RUN without suppressing the scoreboard issue the assess job opens.
  # Reads the PUBLIC /pnl.json (no DB credentials in CI); `--pnl-json` is
  # FAIL-CLOSED, so a dark feed is exit 2, never a vacuous green. BEHIND-OWN
  # is the ONLY ::error:: — DEFERRED / BEHIND-SHARED / FILE-SET are deliberate
  # designs or stamp bookkeeping and stay informational rows in the step
  # summary (a red on a deliberate design is the cry-wolf trap the script's
  # own header records). Guarded by tests/autonomy/test_code_currency_wired.py.
  # [2026-08-20 (sm)] THE CEILING, beside the floors. Operator: "The discussion
  # of the floor is too often had, where the conversation of how high the
  # ceiling goes is of little discussion." Every bar this fleet runs on a
  # schedule asks whether a book is SAFE; this asks how high it could go and
  # what is in the way. Placed here rather than in an image because it needs no
  # DB — it reads the two PUBLIC feeds — and because a script only a human
  # remembers to run is the (gk) shape the go-live grader already had fixed.
  # INFORMATIONAL BY DESIGN: it promotes nothing, moves nothing, and a red here
  # would be a red on "this book could be bigger", which is not a defect. The
  # step summary is the deliverable.
  ceiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: How high can each book go, and what is in the way?
        run: |
          set -euo pipefail
          {
            echo '## 🚀 Ceiling — the mirror of the go-live gate'
            echo '```'
            python3 scripts/ceiling.py 2>&1 || echo '(ceiling read failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The guard must still be able to see (negative fixtures)
        run: python3 scripts/ceiling.py --selftest

  code-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the audit replays the REAL build_compute per commit — a depth-1
          # checkout would classify every container UNRESOLVED and pass,
          # which is exactly the vacuous green the guard test pins against
          fetch-depth: 0
      - name: Fetch the public feed
        run: |
          set -euo pipefail
          curl -sS --retry 3 --retry-delay 5 "$FEED" -o pnl.json
          test -s pnl.json
      - name: Which commit is each container running?
        # depth 200: the audit window must cover a WEEK of history on this
        # cadence (measured 4-Aug: 120 commits in 7 days) or a deliberately
        # DEFERRED live service drifts off the window into UNRESOLVED.
        run: python3 scripts/audit_code_currency.py --pnl-json pnl.json --depth 200 --gha
      # [2026-08-14 (mo)] The feed arm of the roster guard, placed here because
      # this job already fetches the feed and already treats a dark feed as a
      # failure (`test -s pnl.json` above). This is the arm that catches a slot
      # swap AUTOMATICALLY: the moment a new row publishes venue=lighter_live,
      # or a declared one stops, the declaration and reality disagree and this
      # goes red. Fail-closed by construction — an unreadable feed makes no
      # claim rather than passing.
      - name: Does the declared live roster still match the live feed?
        run: python3 scripts/audit_live_roster.py --pnl-json pnl.json

      # [2026-08-16 (pb)] CI COVERAGE — the two workflows disagree about a
      # burst of pushes and the disagreement is silent: Tests cancels
      # in-progress runs, Railway Redeploy does not. Measured 16-Aug over 4
      # hours: 27 of 60 Tests runs cancelled (45%) against 41 successful
      # deploys and zero failures, i.e. code reached containers from commits
      # CI never graded. Placed in THIS job because it is already the
      # deploy-verification job (`code-currency` beside it answers "which
      # commit is running"; this answers "was that commit ever graded").
      # Needs GH_TOKEN for `gh run list`, and a full history to walk back to
      # the last green — a depth-1 checkout would find no green commit and
      # report the whole window ungraded, which is why fetch-depth: 0 above
      # is load-bearing for this step too.
      # Fires ONLY when ungraded commits actually SHIPPED; a doc-only push
      # ungraded is reported and passes, because a guard that reddens on the
      # benign case is one the reader learns to ignore ((gl)).
      - name: Was the deployed code ever graded?
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_ci_coverage.py --depth 60 --gha

  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the feed
        run: |
          set -euo pipefail
          curl -sS --retry 3 --retry-delay 5 "$FEED" -o pnl.json
          test -s pnl.json

      # [2026-08-17 (pp)] The BUS carries the only number that can answer
      # "is the fleet over its budget?" — see the exposure block below for why
      # the feed cannot. `?hours=0` drops the history array: 262 KB instead of
      # 8.6 MB, same live keys. Deliberately NOT fail-closed like the feed
      # above: the scoreboard's primary job is the P&L table, so a dark bus
      # must degrade the exposure flag to UNKNOWN rather than suppress the
      # whole weekly issue.
      - name: Fetch the bus (exposure truth)
        run: |
          set -euo pipefail
          curl -sS --retry 3 --retry-delay 5 "$BUS" -o bus.json || true
          test -s bus.json || { echo "::warning::bus dark - exposure will read UNKNOWN"; rm -f bus.json; }

      - name: Restore last week's snapshot
        uses: actions/cache@v4
        with:
          path: .fleet-snapshot
          key: fleet-snapshot-${{ github.run_id }}
          restore-keys: fleet-snapshot-

      # [2026-07-28 AUDIT FIX] the cache sits exactly at the 7-day eviction
      # boundary on a weekly cron (saved once, next touched 7 days later),
      # so eviction races the restore EVERY week and the OFF-FEED/NEW flags
      # silently never fire. Zero-infra fallback: recover the previous
      # service list from last week's issue table.
      - name: Recover snapshot from last week's issue (cache evicted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f .fleet-snapshot ]; then echo "cache hit"; exit 0; fi
          gh issue list --repo "$GITHUB_REPOSITORY" --label fleet-weekly \
            --state all --limit 1 --json body --jq '.[0].body // empty' \
            > prev_issue.md || true
          python3 - <<'PY'
          import json, re, pathlib
          p = pathlib.Path('prev_issue.md')
          body = p.read_text() if p.exists() else ''
          names = re.findall(r'^\|\s*\d+\s*\|\s*`([^`]+)`', body, re.M)
          if names:
              pathlib.Path('.fleet-snapshot').write_text(
                  json.dumps({'names': sorted(set(names))}))
              print(f"recovered {len(set(names))} names from the last issue")
          else:
              print("no prior issue/table - first-run semantics")
          PY

      - name: Build the scoreboard
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, datetime
          feed = json.load(open('pnl.json'))
          bots = feed.get('bots') or feed.get('services') or []
          if isinstance(bots, dict):
              bots = [{'name': k, **v} for k, v in bots.items()]
          def num(b, *keys):
              for k in keys:
                  v = b.get(k)
                  if isinstance(v, (int, float)): return float(v)
              return 0.0
          # [2026-07-28 AUDIT FIX] read the feed's REAL keys (bot / pnl_abs /
          # open_trades / live+venue_mode) — the first dispatch (issue #99)
          # rendered all 23 rows as '?' at $0.00 marked 'paper' because none
          # of the guessed keys exist on /pnl.json.
          rows = []
          for b in bots:
              rows.append({'name': b.get('bot') or b.get('name') or b.get('service') or '?',
                  'pnl': num(b, 'pnl_abs', 'pnl', 'total_pnl', 'profit_abs'),
                  'open': int(num(b, 'open_trades', 'open_positions')),
                  'stale': bool(b.get('stale')),
                  'live': bool(b.get('live')) or str(b.get('venue_mode') or b.get('mode') or '').lower() == 'lighter_live'})
          rows.sort(key=lambda r: r['pnl'], reverse=True)
          names = {r['name'] for r in rows}
          total_pnl = sum(r['pnl'] for r in rows)
          total_open = sum(r['open'] for r in rows)
          # [2026-08-17 (pp)] EXPOSURE IS READ FROM THE ENFORCER, NOT COUNTED
          # HERE. This flag used to compare `total_open` against a hardcoded
          # EXPOSURE_BUDGET and fired EVERY week measured (58 vs 20, 40 vs 20)
          # while the fleet sat at long 11/20 with a GREEN light -- the budget
          # is long-only and `total_open` is mostly delta-neutral funding legs.
          # The rule lives in `fleet_risk`; this reads its verdict rather than
          # re-deriving it. Logic + its 20-case selftest are in the script so
          # the branches are testable, which they are not inside a heredoc.
          sys.path.insert(0, 'scripts')
          from weekly_exposure_flag import exposure_flag
          bus = json.loads(pathlib.Path('bus.json').read_text()) \
              if pathlib.Path('bus.json').exists() else None
          snap = pathlib.Path('.fleet-snapshot')
          prev = json.loads(snap.read_text()) if snap.exists() else {}
          prev_names = set(prev.get('names', []))
          gone = sorted(prev_names - names)
          new = sorted(names - prev_names) if prev_names else []
          L = []
          L.append(f"## Fleet weekly scoreboard - {datetime.date.today()}")
          L.append("")
          # `open` is stated as a COUNT, not judged against the long budget —
          # it includes shorts and delta-neutral funding legs ((pp), below).
          L.append(f"**{len(rows)} services on feed** | total P&L **${total_pnl:+,.2f}** | **{total_open}** open positions (all books, all sides)")
          L.append("")
          flags = []
          exp = exposure_flag(bus)
          if exp:
              flags.append(exp)
          flags += [f"STALE - `{r['name']}`" for r in rows if r['stale']]
          flags += [f"OFF-FEED since last week - `{g}`" for g in gone]
          flags += [f"NEW on feed - `{n}`" for n in new]
          live = [r['name'] for r in rows if r['live']]
          if live:
              flags.append("REAL-MONEY on feed: " + ", ".join(f"`{x}`" for x in live))
          L.append("### Flags")
          L.append("")
          L.append("\n".join(f"- {f}" for f in flags) if flags else "- Nothing anomalous.")
          L.append("")
          L.append("| # | Service | P&L | Open | Mode |")
          L.append("|---|---|---|---|---|")
          for i, r in enumerate(rows, 1):
              L.append(f"| {i} | `{r['name']}` | ${r['pnl']:+,.2f} | {r['open']} | {'LIVE' if r['live'] else 'paper'} |")
          L.append("")
          L.append("*Generated by fleet-weekly-assessment.yml - deterministic, $0, zero tokens. Ask Claude for the verdict; do not ask it to recompute.*")
          pathlib.Path('body.md').write_text("\n".join(L))
          snap.write_text(json.dumps({'names': sorted(names)}))
          PY

      - name: Open the weekly issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # [2026-07-29 AUDIT R8] ensure the label exists first (the
          # fleet-watchdog pattern): a deleted `fleet-weekly` label made
          # `gh issue create --label` fail the run — visible-red, but the
          # weekly report silently stops until someone reads the failure
          # email. Idempotent; `|| true` because an already-existing label
          # returns non-zero.
          gh label create fleet-weekly --color 1D76DB \
            --description "automated weekly fleet assessment" 2>/dev/null || true
          gh issue create \
            --title "Fleet weekly assessment - $(date -u +%Y-%m-%d)" \
            --label "fleet-weekly" \
            --body-file body.md
