# TEMPORARILY REPURPOSED (branch-only): provisioning completed green in run
# 4 (all four services created + variables + first deploys). GitHub only
# registers dispatchable workflows from the default branch, so this
# registered slot carries the READ-ONLY diagnostic below until the rows
# verify. DELETE AFTER USE — both this and the diag file.
# One-shot DIAGNOSTIC for the BOOKS wave-2 services — DELETE AFTER USE
# (same rule as the provisioner it accompanies). Zero of four rows are
# publishing 20+ min after green deploys; a green run is not a running
# book ((iw)) and this fetches the only evidence that says why: each
# container's own deploy + build logs, and its deployment status.
# READ-ONLY: no variables set, no deploys, no service mutations.
#
# Log hygiene: every printed line is filtered through a hard drop of any
# line containing "postgres" (case-insensitive) — the (kb)/(mk) lesson:
# never trust a value-level redaction against wrapped output.
name: Provision BOOKS wave 2
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Status and logs per service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          for SVC in book-douglas-shadow book-grimes-shadow \
                     book-schwager-shadow book-hull-shadow; do
            echo "::group::$SVC — deploy logs (recent)"
            ( timeout 25 railway logs --service "$SVC" 2>&1 || true ) \
              | tail -n 120 | grep -aiv "postgres" || true
            echo "::endgroup::"
            echo "::group::$SVC — build logs (recent)"
            ( timeout 25 railway logs --build --service "$SVC" 2>&1 || true ) \
              | tail -n 40 | grep -aiv "postgres" || true
            echo "::endgroup::"
          done
          echo "::group::deployment states (status --json, trimmed)"
          railway status --json 2>/dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for env in d.get("environments", {}).get("edges", []):
              for si in env["node"].get("serviceInstances", {}).get("edges", []):
                  n = si["node"]
                  name = n.get("serviceName")
                  if not (name or "").startswith("book-"):
                      continue
                  for dep in n.get("activeDeployments") or []:
                      print(name,
                            "| created", dep.get("createdAt"),
                            "| stopped", dep.get("deploymentStopped"),
                            "| instances",
                            [i.get("status") for i in dep.get("instances") or []])
          ' || echo "status parse failed"
          echo "::endgroup::"
