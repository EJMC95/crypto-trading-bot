# TEMPORARILY REPURPOSED (branch-only): provisioning completed green in run
# 4. Diag v3: bot_pnl HAS all five book rows on the one shared DB (v2
# evidence) while /pnl.json serves only kiyosaki — the four filtered names
# are exactly the ones whose registrations arrived in the 23:35Z merge, so
# the question is whether the serving pnl-dashboard container is actually
# running post-merge code. DELETE AFTER USE.
name: Provision BOOKS wave 2
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: pnl-dashboard deployment state and logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail
          echo "::group::active deployments (all services, created + status)"
          railway status --json 2>/dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for env in d.get("environments", {}).get("edges", []):
              for si in env["node"].get("serviceInstances", {}).get("edges", []):
                  n = si["node"]
                  name = n.get("serviceName")
                  for dep in n.get("activeDeployments") or []:
                      print(name,
                            "| created", dep.get("createdAt"),
                            "| stopped", dep.get("deploymentStopped"),
                            "| instances",
                            [i.get("status") for i in dep.get("instances") or []])
          ' || echo "status parse failed"
          echo "::endgroup::"
          echo "::group::pnl-dashboard deploy logs (recent)"
          ( timeout 25 railway logs --service pnl-dashboard 2>&1 || true ) \
            | tail -n 60 | grep -aiv "postgres" || true
          echo "::endgroup::"
          echo "::group::pnl-dashboard build logs (recent)"
          ( timeout 25 railway logs --build --service pnl-dashboard 2>&1 || true ) \
            | tail -n 30 | grep -aiv "postgres" || true
          echo "::endgroup::"
