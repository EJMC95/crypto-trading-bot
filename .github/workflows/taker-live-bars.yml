name: Taker exit bracket

# [2026-07-29 (fm)] Set the Ticket Taker's exit bracket (TT_TP / TT_SL /
# TT_MAX_HOLD_H) on one taker arm.
#
# WHY THIS EXISTS. With TT_BULL_MODE on, LIVE_LENSES={divergence} reduces the
# live arm to short-divergence-crypto, so the bracket and the slot count are the
# only knobs that still reach it. The growth-rail levers (taker.tp, taker.sl,
# taker.max_hold_h) steer the SHADOW twin on the `lighter-taker` lane and
# deliberately never reach `live.*` — so env is the only route to the live arm,
# and the two arms had silently diverged for days.
#
# THIS IS NOT RESTRICT-ONLY. Widening TT_SL widens a real-money stop: each
# loser can lose more. And the stop does NOT hold at the stop — it is checked on
# the snapshot cadence, so it overshoots: MEASURED on the 200h tape, the -0.03
# bracket's worst realised trade is -5.12% and the -0.04 bracket's is -7.42%
# (both ~2pp past their bar). Size the risk off the OVERSHOOT, not the bar:
# worst-case across 4 slots is ~$2.05 -> ~$2.97 at -0.03 -> -0.04 on a ~$66 book.
# Bounded by the untouched $40 notional cap, the SafetyRails daily-loss halt and
# the kill switch. Treat a change here as a real-money risk decision, not a
# tuning nudge.
#
# [2026-07-29 (fo)] THE REPLAY CANNOT PRICE A STOP ON THIS TAPE. Do not use it
# to justify a TT_SL change. (fm) moved the live arm to 0.06/-0.04/72h on a
# window-sensitivity table, and (fo) REVERTED it the same hour: extending the
# stop ladder past the swept grid, net climbs monotonically with NO interior
# optimum all the way to NO STOP AT ALL (+9.51 vs +7.83 at -0.04 vs +4.14 at the
# deployed -0.03). That is the (fj) artifact — "a wider stop stops realising
# losses that later revert". The decisive detail: with NO stop the worst
# realised trade is -3.35%, SMALLER than the deployed -3% stop's own worst
# (-5.08%) and less than half the -0.04 candidate's (-7.42%). This window
# contains no tail for a stop to cut, so the stop MANUFACTURES the loss.
#
# WHAT SURVIVES: -0.03 is measurably the worst point on its own surface and its
# 72h window fails both halves. That is a reason to DOUBT the deployed stop, not
# a validated replacement. Route any stop change through the experiment judge's
# paired live-vs-shadow bar — NOT through this workflow off a replay number.
#
# Before you dispatch: run the ladder to the no-stop limit. If it has no
# interior optimum, the number you are about to ship is an artifact.
#
# VERIFY BY PUBLISHED OUTPUT (the (df) rule, applied BEFORE claiming a change —
# see (fm) for what happens when it is applied after): `extra.bars` on the row
# must show the new tp/sl/max_hold_h, and `extra.tuned` must stay `[]` on the
# live arm (no growth-rail lever reaches it). Env is read at import, hence the
# redeploy. No code deploy is involved.
#
# REVERSIBLE IN ONE DISPATCH: re-run with the previous values.

on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Which Ticket Taker arm"
        required: true
        default: "tide-rider-lighter-live"
        type: choice
        options:
          - "tide-rider-lighter-live"   # REAL MONEY
          - "lighter-ticket-taker"      # the $1k shadow twin
      tp:
        description: "TT_TP take-profit, fraction (0.02-0.12)"
        required: true
        default: "0.06"
      sl:
        description: "TT_SL stop-loss, NEGATIVE fraction (-0.08 to -0.02)"
        required: true
        default: "-0.04"
      max_hold_h:
        description: "TT_MAX_HOLD_H hours (12-120)"
        required: true
        default: "72"
      sync_tuner_sweep_sl:
        description: "Also set TUNER_SWEEP_SL to match sl (keeps the tuner's TP/HOLD sweep honest at the arm's real stop). Recommended when changing sl."
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

concurrency:
  group: railway-deploy     # serialize with Railway Redeploy — same service surface
  cancel-in-progress: false

jobs:
  set-bars:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate, set the bracket, and redeploy the arm
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ARM_IN: ${{ github.event.inputs.arm }}
          TP_IN: ${{ github.event.inputs.tp }}
          SL_IN: ${{ github.event.inputs.sl }}
          HOLD_IN: ${{ github.event.inputs.max_hold_h }}
          SYNC_IN: ${{ github.event.inputs.sync_tuner_sweep_sl }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."; exit 1
          fi
          case "${ARM_IN}" in
            tide-rider-lighter-live|lighter-ticket-taker) ;;
            *) echo "::error::arm must be one of the two taker services — refusing"; exit 1 ;;
          esac
          # Strict format FIRST (rejects expressions, whitespace, exponents),
          # then a numeric range check. Both must pass — a range test alone
          # would accept things awk is willing to coerce.
          num_ok() { printf '%s' "$1" | grep -Eq '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'; }
          for v in "${TP_IN}" "${SL_IN}" "${HOLD_IN}"; do
            num_ok "$v" || { echo "::error::'$v' is not a plain decimal number — refusing"; exit 1; }
          done
          in_range() {   # value lo hi
            awk -v v="$1" -v lo="$2" -v hi="$3" \
              'BEGIN{exit !(v+0 >= lo && v+0 <= hi)}'
          }
          in_range "${TP_IN}"   0.02  0.12 || { echo "::error::TT_TP ${TP_IN} outside [0.02, 0.12] — refusing"; exit 1; }
          in_range "${SL_IN}"  -0.08 -0.02 || { echo "::error::TT_SL ${SL_IN} outside [-0.08, -0.02] — refusing"; exit 1; }
          in_range "${HOLD_IN}" 12    120  || { echo "::error::TT_MAX_HOLD_H ${HOLD_IN} outside [12, 120] — refusing"; exit 1; }
          if [ "${ARM_IN}" = "tide-rider-lighter-live" ]; then
            echo "::warning::Setting the REAL-MONEY Ticket Taker's exit bracket to tp=${TP_IN} sl=${SL_IN} hold=${HOLD_IN}h. This WIDENS a live stop if sl moved down."
          fi
          # output discarded: `railway variables` may echo the service's FULL
          # variable table (DATABASE_URL, signer keys) unmasked into the log —
          # the dashboard-auth-rotate lesson.
          # [2026-07-29 (ft)] TUNER_SWEEP_SL is pinned single-valued by (fp) so the
          # tuner can never optimise a stop. When the ARM's stop is set here, the
          # tuner's TP/HOLD sweep must run at that SAME stop or it optimises
          # TP/HOLD against a bracket the arm is not running.
          case "${SYNC_IN:-yes}" in
            yes) SYNC_ARG=(--set "TUNER_SWEEP_SL=${SL_IN}") ;;
            no)  SYNC_ARG=() ;;
            *)   echo "::error::sync_tuner_sweep_sl must be yes|no — refusing"; exit 1 ;;
          esac
          railway variables --service "${ARM_IN}" --skip-deploys \
            --set "TT_TP=${TP_IN}" \
            --set "TT_SL=${SL_IN}" \
            --set "TT_MAX_HOLD_H=${HOLD_IN}" \
            "${SYNC_ARG[@]}" > /dev/null 2>&1
          railway redeploy --service "${ARM_IN}" --yes
          echo "Set on ${ARM_IN}: TT_TP=${TP_IN} TT_SL=${SL_IN} TT_MAX_HOLD_H=${HOLD_IN}; redeployed."
          echo "Verify by PUBLISHED OUTPUT: /pnl.json extra.bars must show"
          echo "  taker.tp=${TP_IN} taker.sl=${SL_IN} taker.max_hold_h=${HOLD_IN}"
          echo "and on the live arm extra.tuned must stay [] (no lever reaches live)."
