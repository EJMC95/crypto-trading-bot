# (vw) 2026-08-30 — THIS WAS A 4-SEGMENT MATRIX AND EVERY RUN IT EVER HAD WAS
# RED. The segments passed bare root-level .py filenames through the init
# action's `config: paths:`, and the CodeQL Python extractor walks each
# include path as a DIRECTORY — so extraction crashed with
# `NotADirectoryError: [Errno 20] Not a directory: 'fleet_bus.py'` in all
# four segments, on every run. A guard that has never once run green is not a
# guard (the (gl) rule in a security-scanner costume). The fix is ONE
# whole-repo analysis: Python extraction of this tree takes minutes, so the
# segmentation bought nothing the crash didn't cost.
name: CodeQL Python Segmented

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  python:
    name: python (whole repo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:python
