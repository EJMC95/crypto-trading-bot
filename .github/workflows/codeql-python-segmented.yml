name: CodeQL Python Segmented

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  python-segmented:
    name: python-segmented (${{ matrix.segment.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        segment:
          - name: live-money-core
            paths: |
              - lighter_avo_live_bot.py
              - lighter_family_bot.py
              - venues
              - bot_pnl_store.py
              - fleet_bus.py
          - name: execution-risk
            paths: |
              - lighter_ticket_taker.py
              - lighter_funding_bot.py
              - lighter_funding_spread_bot.py
              - fleet_risk.py
              - fleet_immune.py
              - implementation_shortfall.py
              - paper_broker.py
          - name: organs
            paths: |
              - bot_learn.py
              - fleet_proprioception.py
              - experiment_judge.py
              - event_sentinel.py
              - lighter_market_scout.py
              - lighter_scout_tuner.py
              - strategy_incubator.py
              - fleet_respiration.py
              - fleet_regen.py
              - fleet_clock.py
              - evidence_board.py
              - fleet_allocation.py
              - fleet_radar.py
          - name: analytics-and-scripts
            paths: |
              - scripts
              - pnl_dashboard.py
              - market_context.py
              - market_pulse.py
              - regime_oracle.py
              - fleet_watchdog_svc.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
          config: |
            paths:
            ${{ matrix.segment.paths }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:python/segment:${{ matrix.segment.name }}
