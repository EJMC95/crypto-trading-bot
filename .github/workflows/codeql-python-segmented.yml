# [2026-09-01 (vw)] CodeQL — REBUILT, and GATED on the repo setting it needs.
#
# PR #238 shipped this as a 4-segment matrix whose `config: paths:` listed
# individual root-level .py files — the CodeQL python extractor walks each
# entry as a DIRECTORY and dies (`NotADirectoryError: 'paper_broker.py'`),
# and even past that the upload is refused because CODE SCANNING IS NOT
# ENABLED on this repository. Measured: 10 of 10 runs FAILED, on main, on
# schedule and on every PR — including the two PRs that introduced it. A
# check that is red on every run regardless of the code trains the operator
# to merge past red CI, which is exactly how the 30/31-Aug changelog wipe
# landed ((vw)). A born-broken always-red check is worse than none — the
# (gl) rule's mirror image.
#
# SO: one full-tree python analysis (no `paths:` config — the per-file
# filter is what crashed the extractor, and segmenting ~100 interpreted
# files bought nothing but 4x the runtime), gated on `vars.ENABLE_CODEQL`.
# Until Eamon (1) enables code scanning under Settings → Code security and
# (2) sets the repository variable ENABLE_CODEQL=1, the job SKIPS —
# visible, honest, and not a standing red. Flip both and it runs for real.
name: CodeQL Python Segmented

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  python-codeql:
    name: python-codeql
    runs-on: ubuntu-latest
    # Repo variable, set by the operator once code scanning is enabled in
    # the repository settings — without the setting, upload is refused and
    # the job can only ever fail.
    if: ${{ vars.ENABLE_CODEQL == '1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:python
