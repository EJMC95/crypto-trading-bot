# One-shot VARIABLES-ONLY attestation for 🔮 georgia's live service — DELETE
# AFTER USE (the (lr) rule). [2026-08-25 (tl)] Sets GEORGIA_MANUAL_PNL_USD,
# the (td) manual-trade attestation: the (tk) audit measured her four
# zero-basis 22-Aug flatten closes (ETH/ZEC/BTC/HYPE) at ≈ −$26.4 of residual
# that is Eamon's manual trading, not hers, and Eamon confirmed the number
# ("do the same for georgia"). Display-side only — no trade, gate or sizing
# reads it. Service is trail-blazer-live (the (ta) slot swap; service names
# lie). Safe on her halted day: the (pq) durable halt survives the restart,
# proven live at the 13:46Z redeploy today.
name: Attest georgia manual P&L
on:
  workflow_dispatch:
    inputs:
      manual_pnl:
        description: "GEORGIA_MANUAL_PNL_USD (operator-attested manual-trade level)"
        required: false
        default: "-26.4"
        type: string

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Set variable
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IN_VAL: ${{ inputs.manual_pnl }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set"; exit 1
          fi
          if [ -z "${IN_VAL:-}" ]; then
            echo "::error::no value given"; exit 1
          fi
          SVC="trail-blazer-live"
          echo "::group::$SVC — set GEORGIA_MANUAL_PNL_USD (names only in this log)"
          railway variables --service "$SVC" \
            --set "GEORGIA_MANUAL_PNL_USD=${IN_VAL}" \
            || { echo "::error::$SVC variable set failed"; exit 1; }
          echo "variable applied; Railway redeploys the existing image with the new env"
          echo "::endgroup::"
