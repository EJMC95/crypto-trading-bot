name: Fleet review kick-off (21-Jul)

# [2026-07-15 — operator-queue item: durable review kick-off]
# Opens ONE issue at 09:00 AEST on Tue 21 Jul 2026 so the scheduled fleet
# review (FLEET_REVIEW_AGENDA_2026-07-21.md) cannot be missed: paste the
# issue into a Claude session (or just say "run the 21-Jul review") and it
# executes the agenda. Chosen over Claude-session cron (containers are
# reclaimed; a session job would silently never fire) and over the MCP
# scheduler (needs an interactive claude.ai connector approval). Cron is
# UTC: 20-Jul 23:00Z == 21-Jul 09:00 AEST. NOTE: a 5-field cron recurs
# YEARLY on that date — delete this workflow at the review (agenda item 8).
#
# [2026-07-15b HOTFIX] the first version put the issue body as a multi-line
# double-quoted string with column-0 lines, which terminated the `run: |`
# YAML block scalar early -> GitHub could not parse the file and raised a
# failed run (and a failure email) on EVERY push. Rebuilt with printf: each
# body line is a quoted arg whose leading indentation is OUTSIDE the quotes,
# so the YAML stays valid AND the rendered issue body has no stray spaces.

on:
  schedule:
    - cron: '0 23 20 7 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the review kick-off issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          printf '%s\n' \
            "It is 9:00 am AEST, Tuesday 21 July 2026 — the change freeze review is due." \
            "" \
            "How to run: tell Claude \"run the 21-Jul review per FLEET_REVIEW_AGENDA_2026-07-21.md\"." \
            "" \
            "Agenda (full detail in the doc):" \
            "1. Long budget — re-derive from the week's exposure/effective-bet history + veto cost off the marks tape" \
            "2. Lens verdicts + Ticket Taker bar sweeps via lighter_ticket_replay.py (incl. dip starvation)" \
            "3. First stake-multiplier candidates (family tags collecting since 15-Jul)" \
            "4. Venue A/B -> live-vs-shadow tracking-error (Funding Farmer half already running, 15-Jul (f))" \
            "5. Go-live gate restatement in expectancy terms (deadline ~12-Aug)" \
            "6. Drawdown governor first-week check" \
            "7. Operator checklist status" \
            "8. Freeze-exception log review — then lift the freeze and DELETE this workflow (.github/workflows/review-reminder.yml)" \
            > /tmp/review-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Run the 21-Jul fleet review (agenda loaded 15-Jul)" \
            --body-file /tmp/review-body.md
