# One-shot VARIABLES-ONLY risk-up for the live trio — DELETE AFTER USE (the
# (lr) rule). [2026-08-26 (tq)] Eamon's directive, on the record: "adjust to
# whatever enables more trades and less restriction, leverage optioned."
# Every value below is DERIVED from the host's own honest-ceiling formula
# (the (th) comment at the overshoot telemetry): a stop survives a gapped
# fill only while G < 1/(|stop| + overshoot + mmf), with overshoot = the one
# measured datum on tape (217bps, georgia's DOGE −7.17% fill on a −5% stop)
# and mmf = the venue-worst 600bps measured at (sy).
#
#   🙏 avo (tide-rider-lighter-live), stop −10%:
#     ceiling 1/(0.10+0.0217+0.06) = 5.503x
#     AVO_GROSS_X_MAX 5.0 -> 5.5 (the ceiling), AVO_GROSS_X 5.0 -> 5.3
#     (96% of it — strictly inside, the (gv) discipline). all_slots_stop
#     becomes 53%; stop_dead_above stays 6.25 and the row publishes both.
#     EQUITY_SCALED_CAP=1: with the (to) code in her image the $1,700 cap
#     becomes the FLOOR of max(floor, equity x gross x 1.05) — the cap can
#     never strand a slot again as she grows.
#   🔮 georgia (trail-blazer-live), stop −5%:
#     ceiling 1/(0.05+0.0217+0.06) = 7.593x
#     GEORGIA_GROSS_X 5.0 -> 7.0 (92% of it; GROSS_X_MAX default 10 admits
#     it). Effective deployment now 7.0 x the board's 0.75 clip = 5.25x
#     (vs 3.75x today, +40%), and 7.0x when the clip self-heals (~29-Aug).
#     LIGHTER_MAX_DAILY_LOSS 20 -> 27 = parity with the designed 10% pct
#     rail (0.10 x 266 = 26.6) — the (tn) derivation at her service; the
#     abs rail returns to backstop. EQUITY_SCALED_CAP=1 (floor $5,000).
#   👩 mum: UNTOUCHED, with the reason stated rather than silent — 9.5x is
#     Eamon's own on-record setting at the edge of stop-death (10.0), and
#     the (th) arithmetic (53bps liq headroom vs the 217bps overshoot
#     datum) is already published on her row. Nothing opens here without
#     deleting her stop, which no directive asks for.
#
# One variables call per service so each restarts ONCE. Positions restore
# from durable state (avo 4 open, georgia 1 — her ratchet stop_px lives in
# meta and survives). No halt is active on either row. Names only in logs
# ((ml): never echo resolved values).
name: Live risk-up (avo + georgia)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type RISK-UP to proceed"
        required: true
        type: string

jobs:
  riskup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Set variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set"; exit 1
          fi
          if [ "${IN_CONFIRM:-}" != "RISK-UP" ]; then
            echo "::error::confirmation phrase missing"; exit 1
          fi
          echo "::group::tide-rider-lighter-live — avo gross 5.3/5.5 + scaled cap (names only)"
          railway variables --service "tide-rider-lighter-live" \
            --set "AVO_GROSS_X=5.3" \
            --set "AVO_GROSS_X_MAX=5.5" \
            --set "EQUITY_SCALED_CAP=1" \
            || { echo "::error::avo variable set failed"; exit 1; }
          echo "::endgroup::"
          echo "::group::trail-blazer-live — georgia gross 7.0 + halt parity + scaled cap (names only)"
          railway variables --service "trail-blazer-live" \
            --set "GEORGIA_GROSS_X=7.0" \
            --set "LIGHTER_MAX_DAILY_LOSS=27" \
            --set "EQUITY_SCALED_CAP=1" \
            || { echo "::error::georgia variable set failed"; exit 1; }
          echo "::endgroup::"
          echo "variables applied; Railway redeploys each existing image with the new env"
