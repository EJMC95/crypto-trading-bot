name: ci-notify

# Replaces send_later PR check-in chains (CLAUDE.md doctrine P1-P2).
# Posts CI/merge transitions ON the PR; nothing wakes a Claude session.

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Report the transition on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.check_suite.head_sha || github.event.pull_request.head.sha }}"
          [ -z "$HEAD_SHA" ] && exit 0

          PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number' 2>/dev/null || true)
          [ -z "${PR:-}" ] || [ "$PR" = "null" ] && { echo "no PR for $HEAD_SHA"; exit 0; }

          STATE=$(gh api "repos/$REPO/pulls/$PR" --jq '.mergeable_state')
          CONC=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                  --jq '[.check_runs[] | select(.conclusion != null) | .conclusion] | unique | join(",")')
          echo "PR #$PR mergeable_state=$STATE checks=$CONC"

          # Deduplicate: only comment when the message would differ from our last one.
          MARK="<!-- ci-notify -->"
          case "$STATE" in
            clean)
              [ "$CONC" = "success" ] && BODY="$MARK ✅ CI green and mergeable. Ready to merge." || BODY="" ;;
            dirty)
              BODY="$MARK ⚠️ Merge conflict — branch needs a re-merge with main." ;;
            blocked|unstable)
              case "$CONC" in *failure*) BODY="$MARK 🔴 CI failed ($CONC) — blocked." ;; *) BODY="" ;; esac ;;
            *) BODY="" ;;
          esac
          [ -z "$BODY" ] && exit 0

          LAST=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- ci-notify -->"))] | last | .body' 2>/dev/null || true)
          [ "$LAST" = "$BODY" ] && { echo "unchanged; not repeating"; exit 0; }
          gh pr comment "$PR" --repo "$REPO" --body "$BODY"
