name: ci-notify

# Replaces send_later PR check-in chains (CLAUDE.md doctrine P1-P2).
# Posts CI/merge transitions ON the PR; nothing wakes a Claude session.

# [2026-07-28 AUDIT FIX] check_suite NEVER fired: GitHub does not deliver
# check_suite events for suites created by GitHub Actions ("to prevent
# recursive workflows"), and every suite in this repo (Tests, Changelog
# check) IS Actions — measured: 5 runs total, all event=pull_request, zero
# check_suite, so the CI-TRANSITION half of this notifier was structurally
# dead and the pull_request firings ran BEFORE checks finished (empty CONC).
# workflow_run is the sanctioned pattern for exactly this.
on:
  workflow_run:
    workflows: ["Tests", "Changelog check"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  checks: read
  statuses: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-notify-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    # main-branch runs are post-merge CI - no PR to notify. [28-Jul-2026 quota diet]
    if: github.event.workflow_run == null || github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Report the transition on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}"
          if [ -z "$HEAD_SHA" ]; then exit 0; fi

          PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then echo "no PR for $HEAD_SHA"; exit 0; fi

          STATE=$(gh api "repos/$REPO/pulls/$PR" --jq '.mergeable_state')
          CONC=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                  --jq '[.check_runs[] | select(.conclusion != null) | select(.name != "notify") | .conclusion] | unique | join(",")')
          echo "PR #$PR mergeable_state=$STATE checks=$CONC"

          MARK="<!-- ci-notify -->"
          BODY=""
          case "$STATE" in
            clean)
              if [ "$CONC" = "success" ]; then BODY="$MARK ✅ CI green and mergeable. Ready to merge."; fi ;;
            dirty)
              BODY="$MARK ⚠️ Merge conflict — branch needs a re-merge with main." ;;
            blocked|unstable)
              case "$CONC" in *failure*) BODY="$MARK 🔴 CI failed ($CONC) — blocked." ;; esac ;;
          esac
          if [ -z "$BODY" ]; then exit 0; fi

          # Deduplicate: only comment when the message differs from our last one.
          LAST=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- ci-notify -->"))] | last | .body' 2>/dev/null || true)
          if [ "$LAST" = "$BODY" ]; then echo "unchanged; not repeating"; exit 0; fi
          gh pr comment "$PR" --repo "$REPO" --body "$BODY"
