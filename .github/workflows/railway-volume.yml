name: Railway Volume

# One-off helper to create/list a Railway volume via the CLI, so the persistent
# freqtrade DB dir (/freqtrade/persist) can be attached without the dashboard.
# action=list (default) is safe: prints CLI help + existing volumes.
# action=add: creates the volume on the given service at the mount path.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list (safe) or add"
        required: false
        default: "list"
      service:
        description: "Railway service to attach the volume to"
        required: false
        default: "freqtrade-bots"
      mount_path:
        description: "Mount path inside the container"
        required: false
        default: "/freqtrade/persist"

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: |
          set -uo pipefail
          # The npm postinstall downloads a signed GitHub-release binary whose URL
          # can expire mid-flight ("Failed fetching the binary: jwt:expired").
          # Retry a few times with backoff so a transient fetch miss self-heals.
          n=0
          until [ "$n" -ge 5 ]; do
            if npm install -g @railway/cli; then
              echo "Railway CLI installed"; exit 0
            fi
            n=$((n+1))
            echo "install attempt $n failed; retrying in $((n*3))s..."
            sleep $((n*3))
          done
          echo "::error::Railway CLI install failed after retries"; exit 1
      - name: Volume op
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          SERVICE: ${{ github.event.inputs.service }}
          MOUNT: ${{ github.event.inputs.mount_path }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then echo "::error::RAILWAY_TOKEN not set"; exit 1; fi
          echo "CLI: $(railway --version || echo unknown)"
          echo "===== railway volume --help ====="; railway volume --help 2>&1 || true
          echo "===== railway volume add --help ====="; railway volume add --help 2>&1 || true
          echo "===== existing volumes ====="; railway volume list 2>&1 || railway volume 2>&1 || true
          if [ "${ACTION:-list}" = "add" ]; then
            echo "===== adding volume '$MOUNT' on service '$SERVICE' ====="
            # NOTE: `-s/--service` is a GROUP-level option on `railway volume`, NOT on
            # the `add` subcommand (which only accepts -m/--mount-path and --json). The
            # service therefore has to be given BEFORE the `add` verb.
            railway volume --service "$SERVICE" add --mount-path "$MOUNT" 2>&1 \
              || railway volume -s "$SERVICE" add -m "$MOUNT" 2>&1 \
              || { echo "::error::volume add failed — see help output above for correct flags"; exit 1; }
            echo "===== volumes after ====="; railway volume --service "$SERVICE" list 2>&1 || railway volume list 2>&1 || true
          fi
