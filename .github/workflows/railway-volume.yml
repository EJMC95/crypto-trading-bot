name: Railway Volume

# One-off helper to create/list a Railway volume via the CLI, so the persistent
# freqtrade DB dir (/freqtrade/persist) can be attached without the dashboard.
# action=list (default) is safe: prints CLI help + existing volumes.
# action=add: creates the volume on the given service at the mount path.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list (safe) or add"
        required: false
        default: "list"
      service:
        description: "Railway service to attach the volume to"
        required: false
        default: "freqtrade-bots"
      mount_path:
        description: "Mount path inside the container"
        required: false
        default: "/freqtrade/persist"
      environment:
        description: "Railway environment"
        required: false
        default: "production"

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: |
          set -uo pipefail
          # The npm postinstall downloads a signed GitHub-release binary whose URL
          # can expire mid-flight ("Failed fetching the binary: jwt:expired").
          # Retry a few times with backoff so a transient fetch miss self-heals.
          n=0
          until [ "$n" -ge 5 ]; do
            if npm install -g @railway/cli; then
              echo "Railway CLI installed"; exit 0
            fi
            n=$((n+1))
            echo "install attempt $n failed; retrying in $((n*3))s..."
            sleep $((n*3))
          done
          echo "::error::Railway CLI install failed after retries"; exit 1
      - name: Volume op
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          SERVICE: ${{ github.event.inputs.service }}
          MOUNT: ${{ github.event.inputs.mount_path }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then echo "::error::RAILWAY_TOKEN not set"; exit 1; fi
          ENVIRONMENT="${ENVIRONMENT:-production}"
          echo "CLI: $(railway --version || echo unknown)"
          echo "===== railway --help (global flags) ====="; railway --help 2>&1 | head -80 || true
          echo "===== railway link --help ====="; railway link --help 2>&1 || true
          echo "===== railway volume add --help ====="; railway volume add --help 2>&1 || true
          echo "===== existing volumes ====="; railway volume list 2>&1 || railway volume 2>&1 || true
          if [ "${ACTION:-list}" = "add" ]; then
            # `railway volume add` (help) only accepts -m/--mount-path + --json; earlier
            # runs proved that passing --service via the group flag still panics
            # (Option::unwrap on None at volume.rs:836) because in a project-token
            # context no service is linked, so add can't resolve which service to
            # attach to. Fix: link the project/service/environment first (non-
            # interactively), THEN add the volume against the linked context.
            echo "===== linking project -> service '$SERVICE' / env '$ENVIRONMENT' ====="
            railway link --service "$SERVICE" --environment "$ENVIRONMENT" </dev/null 2>&1 \
              || railway link -s "$SERVICE" -e "$ENVIRONMENT" </dev/null 2>&1 \
              || railway link --service "$SERVICE" </dev/null 2>&1 \
              || echo "(link step non-fatal; continuing)"
            echo "===== status after link ====="; railway status 2>&1 || true
            echo "===== adding volume '$MOUNT' ====="
            ok=0
            # Try the documented forms in order; each fed /dev/null so any interactive
            # prompt gets EOF and fails fast instead of hanging.
            railway volume add --service "$SERVICE" --environment "$ENVIRONMENT" --mount-path "$MOUNT" </dev/null 2>&1 && ok=1
            if [ "$ok" -ne 1 ]; then railway volume add --service "$SERVICE" --mount-path "$MOUNT" </dev/null 2>&1 && ok=1; fi
            if [ "$ok" -ne 1 ]; then railway volume add --mount-path "$MOUNT" </dev/null 2>&1 && ok=1; fi
            if [ "$ok" -ne 1 ]; then echo "::error::volume add failed — see help + status output above"; exit 1; fi
            echo "===== volumes after ====="; railway volume list 2>&1 || true
          fi
