name: Railway Volume

# One-off helper to create/list a Railway volume via the CLI, so the persistent
# freqtrade DB dir (/freqtrade/persist) can be attached without the dashboard.
# action=list (default) is safe: prints CLI help + existing volumes.
# action=add: creates the volume on the given service at the mount path.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list (safe) or add"
        required: false
        default: "list"
      service:
        description: "Railway service to attach the volume to"
        required: false
        default: "freqtrade-bots"
      mount_path:
        description: "Mount path inside the container"
        required: false
        default: "/freqtrade/persist"
      environment:
        description: "Railway environment"
        required: false
        default: "production"
      project:
        description: "Railway project (id or name)"
        required: false
        default: "9b3b7d3c-28db-417b-b864-ebc065df851f"

jobs:
  volume:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: |
          set -uo pipefail
          # The npm postinstall downloads a signed GitHub-release binary whose URL
          # can expire mid-flight ("Failed fetching the binary: jwt:expired").
          # Retry a few times with backoff so a transient fetch miss self-heals.
          n=0
          until [ "$n" -ge 5 ]; do
            if npm install -g @railway/cli; then
              echo "Railway CLI installed (npm): $(railway --version || echo unknown)"
              # `volume add` in the npm build only exposes -m/--mount-path, but its
              # runtime error tells you to "specify one via the --service flag" — that
              # flag exists in the current upstream build. Upgrade to it so we can name
              # the service directly (a project token can't `railway link` a service).
              railway upgrade --yes 2>&1 || echo "(railway upgrade skipped/failed; continuing on npm build)"
              echo "Railway CLI now: $(railway --version || echo unknown)"
              exit 0
            fi
            n=$((n+1))
            echo "install attempt $n failed; retrying in $((n*3))s..."
            sleep $((n*3))
          done
          echo "::error::Railway CLI install failed after retries"; exit 1
      - name: Volume op
        env:
          # ACCOUNT/team token (broad scope) — required for `railway link` + creating
          # a service-attached volume. A project token (RAILWAY_TOKEN) cannot do it.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          # project token — fine for read-only ops (volume list) as a fallback.
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          SERVICE: ${{ github.event.inputs.service }}
          MOUNT: ${{ github.event.inputs.mount_path }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          PROJECT: ${{ github.event.inputs.project }}
        run: |
          set -uo pipefail
          ENVIRONMENT="${ENVIRONMENT:-production}"
          echo "CLI: $(railway --version || echo unknown)"

          # Auth selection: for `add` we NEED the account token (link/create scope).
          # The Railway CLI reads RAILWAY_API_TOKEN for account/team auth and
          # RAILWAY_TOKEN for project auth; if both are set the project token wins and
          # stays scoped, so when using the account token we must NOT export
          # RAILWAY_TOKEN.
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Auth: account token (RAILWAY_API_TOKEN)"
            unset RAILWAY_TOKEN || true
            echo "whoami: $(railway whoami 2>&1 || echo '?')"
          elif [ -n "${RAILWAY_PROJECT_TOKEN:-}" ]; then
            echo "Auth: project token (read-only ops only)"
            export RAILWAY_TOKEN="$RAILWAY_PROJECT_TOKEN"
          else
            echo "::error::No token set. Add secret RAILWAY_ACCOUNT_TOKEN (account token) for add."; exit 1
          fi

          echo "===== railway volume add --help ====="; railway volume add --help 2>&1 || true

          if [ "${ACTION:-list}" = "add" ]; then
            if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
              echo "::error::action=add needs an ACCOUNT token. Create one (Railway > Account Settings > Tokens) and add it as repo secret RAILWAY_ACCOUNT_TOKEN."; exit 1
            fi
            echo "===== linking project '$PROJECT' / env '$ENVIRONMENT' / service '$SERVICE' ====="
            railway link --project "$PROJECT" --environment "$ENVIRONMENT" --service "$SERVICE" </dev/null 2>&1 \
              || railway link -p "$PROJECT" -e "$ENVIRONMENT" -s "$SERVICE" </dev/null 2>&1 \
              || { echo "::error::railway link failed — check the account token has access to project $PROJECT."; exit 1; }
            echo "===== status after link ====="; railway status 2>&1 || true
            echo "===== adding volume '$MOUNT' (linked service) ====="
            ok=0
            railway volume add --mount-path "$MOUNT" </dev/null 2>&1 && ok=1
            if [ "$ok" -ne 1 ]; then railway volume add -m "$MOUNT" </dev/null 2>&1 && ok=1; fi
            if [ "$ok" -ne 1 ]; then echo "::error::volume add failed even with account token — see output above."; exit 1; fi
            echo "===== volumes after ====="; railway volume list 2>&1 || true
            echo "Volume created. freqtrade-bots will redeploy; its trade DBs at $MOUNT now persist across redeploys."
          else
            echo "===== existing volumes ====="; railway volume list 2>&1 || railway volume 2>&1 || true
          fi
