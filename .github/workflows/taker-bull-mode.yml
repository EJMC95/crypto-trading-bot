name: Taker BULL dual-mode

# [2026-07-29 (fl)] Set TT_BULL_MODE on a Ticket Taker arm.
#
# [2026-07-29 (fm) CORRECTION — read this before believing the header below.]
# This workflow was written believing the gate was still OFF on the live arm and
# that dispatching it would turn bull mode on. IT WAS ALREADY ON: the operator
# set TT_BULL_MODE=on on tide-rider-lighter-live on 24-Jul ((dh)), and on the
# shadow arm on 24-Jul too ((df)). Both arms have published extra.bull=true ever
# since. The first dispatch of this workflow was a NO-OP that bounced a
# real-money container. The workflow itself is fine and remains the supported
# way to flip the gate in EITHER direction — but the "EVIDENCE" block below is a
# counterfactual for what bull mode bought when the OPERATOR enabled it, NOT a
# pending change, and there is no bull-off control arm anywhere in the fleet.
# CHECK extra.bull ON /pnl.json BEFORE DISPATCHING, not after.
#
# WHAT IT DOES: RESTRICT-ONLY. `bull_entry_ok` can only SKIP an entry the base
# filters already admitted. It admits only (breakout,long) / (breakoutup,long) /
# (divergence,short), crypto-only (tradfi contaminates the read), with a
# per-asset regime gate — a LONG needs a CONFIRMED up, a SHORT is refused only
# INTO a confirmed up. It cannot open anything the bot would not otherwise open,
# cannot enlarge a clip, and cannot loosen a stop.
#
# EVIDENCE (lighter_ticket_replay.py, the taker's OWN decision code, recorded
# scout tape, 2026-07-29): positive at EVERY window tested, vs a live baseline
# negative at every one —
#     72h  live -13.42  ->  BULL +6.86
#    120h  live -21.88  ->  BULL +8.27
#    168h  live -18.92  ->  BULL +9.29
#    200h                    BULL +6.81   (38 closes, 50% wr, +0.358%/trade,
#                                          19 tp / 18 sl / 1 hold)
# On this tape it resolves to short-divergence-only, crypto-only — which is what
# BOTH arms' real ledgers independently said was the only edge (shadow:
# short-divergence +$15.64 of a +$5.11 book; live: every long-divergence trade
# lost, 3/3). The replay accrues NO funding, and collecting the funding credit is
# the divergence short's whole thesis, so these numbers UNDERSTATE the change.
#
# NO CODE DEPLOY NEEDED: `lighter_ticket_taker.py` is byte-identical between the
# live arm's build era and HEAD, so the live image already carries the gate; only
# the env var is missing. Env is read at import, hence the redeploy.
#
# REVERSIBLE IN ONE DISPATCH: run again with mode=off.
# VERIFY BY PUBLISHED OUTPUT (the (df) rule): the row's extra must show the lens
# mix collapse to short-divergence; `extra.bars` and `extra.build` are unchanged
# by this (it is an env gate, not a bar), so watch the CLOSES, not the bars.

#
# [2026-09-10 (zv)] THE `tide-rider-lighter-live` OPTION IS REMOVED, AND THIS
# WORKFLOW NO LONGER RESTARTS A REAL-MONEY CONTAINER. Corrected in place per
# I12, because the header above describes a service that has not run this bot
# since 13-Aug.
#
# WHAT CHANGED UNDER IT: `(ma)` swapped that slot — `tide-rider-lighter-live`
# now runs 🙏 Avo Maria (`lighter_avo_live_bot.py`), and the Ticket Taker's
# live arm is RETIRED. The taker survives only as the $1k shadow twin inside
# `freqtrade-bots`.
#
# WHY THAT MAKES THE OLD DEFAULT A PURE COST. MEASURED 10-Sep:
# `grep -c 'TT_TP\|TT_SL\|TT_MAX_HOLD_H\|TT_BULL_MODE'` returns **0** for
# `lighter_avo_live_bot.py`, **0** for `lighter_family_bot.py` and **25** for
# `lighter_ticket_taker.py`. So dispatching this at its own default set TT_*
# variables on a container that reads none of them, and then ran
# `railway redeploy --yes` on a REAL-MONEY book — benefit zero by
# construction, cost one restart of a book that was holding positions
# (9 open across the two live books at the moment this was written).
#
# THIS ALREADY HAPPENED ONCE AND WAS RECORDED, which is why it is closed now
# rather than noted again: the sibling `taker-bull-mode.yml` header says of its
# own first dispatch, *"a NO-OP that bounced a real-money container"*. That was
# a wrong belief about one variable; this is the same shape made STRUCTURAL by
# the slot swap, so it would have recurred on every dispatch.
#
# Eamon, 10-Sep: *"dont restart things untill bots have cleared their current
# orders or you just lose more money"* — a real-money restart that buys nothing
# is the cheapest possible thing to stop doing.
#
# RESTORING IT IS A DELIBERATE EDIT, not a dropdown (the `LIVE_SIDES`
# precedent: real money on a new path is an explicit edit). If a taker live arm
# is ever revived, add its service back to BOTH the `options:` list and the
# `case` guard, and pin it in
# `tests/autonomy/test_taker_var_workflows_target_the_shadow.py`.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Which Ticket Taker arm"
        required: true
        default: "lighter-ticket-taker"
        type: choice
        options:
          - "lighter-ticket-taker"      # the $1k shadow twin (control arm)
      mode:
        description: "TT_BULL_MODE"
        required: true
        default: "on"
        type: choice
        options:
          - "on"
          - "off"

concurrency:
  group: railway-deploy     # serialize with Railway Redeploy — same service surface
  cancel-in-progress: false

jobs:
  set-bull-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set TT_BULL_MODE and redeploy the arm
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ARM_IN: ${{ github.event.inputs.arm }}
          MODE_IN: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."; exit 1
          fi
          case "${ARM_IN}" in
            lighter-ticket-taker) ;;
            tide-rider-lighter-live)
              echo "::error::tide-rider-lighter-live runs 🙏 Avo Maria since (ma) 13-Aug, not the Ticket Taker. It reads NO TT_* variable (measured: 0 hits in lighter_avo_live_bot.py and lighter_family_bot.py), so this would restart a REAL-MONEY book for zero effect — refusing."; exit 1 ;;
            *) echo "::error::arm must be the taker shadow twin — refusing"; exit 1 ;;
          esac
          case "${MODE_IN}" in
            on|off) ;;
            *) echo "::error::mode must be on|off — refusing"; exit 1 ;;
          esac
          if [ "${ARM_IN}" = "tide-rider-lighter-live" ]; then
            echo "::warning::Setting TT_BULL_MODE=${MODE_IN} on the REAL-MONEY Ticket Taker."
          fi
          # output discarded: `railway variables` may echo the service's FULL
          # variable table (DATABASE_URL, signer keys) unmasked into the log —
          # the dashboard-auth-rotate lesson.
          railway variables --service "${ARM_IN}" --skip-deploys \
            --set "TT_BULL_MODE=${MODE_IN}" > /dev/null 2>&1
          railway redeploy --service "${ARM_IN}" --yes
          echo "TT_BULL_MODE=${MODE_IN} set on ${ARM_IN}; service redeployed."
          echo "Verify by PUBLISHED OUTPUT: the arm's closes should collapse to"
          echo "short-divergence (crypto-only). Bars/build are unchanged by design."
