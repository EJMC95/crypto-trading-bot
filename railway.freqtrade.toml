# Service-specific Railway config for the Freqtrade bots service ONLY.
# Pointed at via the crypto-trading-bot (feisty-delight) service's
# Config-as-code "Railway Config File" setting, so it does NOT affect the
# separate custom-bot services that deploy from this same repo.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.freqtrade"

[deploy]
# Always restart the freqtrade bots service on any exit (crash or otherwise),
# with no retry cap — keep it running indefinitely.
restartPolicyType = "always"
