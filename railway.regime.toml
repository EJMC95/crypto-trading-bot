# Service-specific Railway config for the perps-regime-switch service ONLY.
# Pointed at via that service's Config-as-code "Railway Config File" setting,
# so it does NOT affect the other services that deploy from this same repo.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.regime"

[deploy]
startCommand = "sh /freqtrade/run_regime.sh"
# Restart on any exit (crash or otherwise), no retry cap — keep it running.
restartPolicyType = "always"
