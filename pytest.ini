[pytest]
# The fleet had NO automated test suite before 2026-07-18: 147 py files, zero
# pytest tests, and ~38 in-module `--selftest` blocks that NOTHING ran. A
# regression in a *covered* function still shipped green because the selftest
# was never executed. This config + tests/ is that missing regression net.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    selftest: runs an in-module `--selftest` block as a subprocess (the pre-existing de-facto tests)
    real_money: exercises the LIVE real-money surface (venues/, the two live bots, the taker)
    financial: dashboard / P&L accounting integrity (double-count, aggregation, publish schema)
    autonomy: growth-rail / autonomy organs (levers, veto, promotion, kill switch)
