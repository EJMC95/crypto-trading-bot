[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighter-adaptive-ensemble-bots"
version = "0.1.0"
description = "Backtest-first long/short perpetual ensemble for the Lighter exchange"
requires-python = ">=3.11"
dependencies = [
  "lighter-sdk>=1.1.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
lighter-bots = "lighter_bots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
